name: Zen Twilight Scheduled Releases

on:
  schedule:
    - cron: "0 22 */2 * *"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Whether to do a release"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  twilight-release-schedule:
    name: Twilight Release Schedule
    permissions:
      # The most any job of build.yml declares.
      contents: write
    # Kept: the release job of build.yml reads its signing secrets from the
    # Deploy-Release and Deploy-Twilight environments, and environment secrets
    # only reach a called workflow through inherit.
    secrets: inherit
    uses: ./.github/workflows/build.yml
    with:
      create_release: ${{ github.event_name != 'workflow_dispatch' && true || inputs.create_release }}
      update_branch: twilight
      use-sccache: false
      update_version: false

  post-build:
    name: Post Build
    runs-on: ubuntu-latest
    needs: twilight-release-schedule
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: ".nvmrc"
