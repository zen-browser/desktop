  value: true

# Astra: Disable geolocation
- name: geo.enabled
  value: false

# Astra: Battery API enabled for Energy Saver feature
- name: dom.battery.enabled
  value: true

# Astra: Disable beacon API
- name: beacon.enabled
  value: false

# Astra: WebGL enabled (disable manually for max privacy)
- name: webgl.disabled
  value: false

# Astra: Enable HTTPS-only in private browsing
- name: dom.security.https_only_mode_pbm
  value: true

# Astra: First Party Isolation (disabled - breaks Google login)
- name: privacy.firstparty.isolate
  value: false

# Astra: Resist fingerprinting
- name: privacy.resistFingerprinting
  value: false

# Astra: Letterboxing (hides screen size)
- name: privacy.resistFingerprinting.letterboxing
  value: false

# Astra: Block canvas fingerprinting
- name: privacy.resistFingerprinting.block_mozAddonManager
  value: true

# Astra: WebRTC leak protection
- name: media.peerconnection.ice.no_host
  value: true
- name: media.peerconnection.ice.proxy_only_if_behind_proxy
  value: true
- name: media.peerconnection.ice.default_address_only
  value: true

# Astra: Spoof timezone (anti-fingerprint)
- name: privacy.resistFingerprinting.reduceTimerPrecision
  value: true

# Astra: Block third party cookies completely
- name: network.cookie.cookieBehavior
  value: 5

# Astra: Enable Global Privacy Control
- name: privacy.globalprivacycontrol.enabled
  value: true
# Astra: Network state partitioning (anti-tracking)
- name: privacy.partition.network_state
  value: true
- name: privacy.partition.serviceWorkers
  value: true
- name: privacy.partition.network_state.ocsp_cache
  value: true
- name: privacy.globalprivacycontrol.functionality.enabled
  value: true

# Astra: HTTP/3 (QUIC) — match Firefox upstream (enabled)
- name: network.http.http3.enable
  value: true

# Prefer Firefox networking defaults for page-load latency.
# Prior Astra privacy overrides (disablePrefetch=true, prefetch-next=false,
# speculative-parallel-limit=4) measurably delayed navigation vs upstream.
# Tracking protection remains via ETP + uBlock, not by disabling DNS/link hints.
- name: network.dns.disablePrefetch
  value: false
- name: network.dns.disablePrefetchFromHTTPS
  value: false

- name: network.prefetch-next
  value: true

# Firefox upstream default is 20 (firefox.js).
- name: network.http.speculative-parallel-limit
  value: 20

# Astra: Disable TLS 0-RTT early data (replay risk; tiny latency tradeoff)
- name: security.tls.enable_0rtt_data
  value: false

# Astra: Clear cookies and cache on exit
- name: privacy.sanitize.sanitizeOnShutdown
  value: true
- name: privacy.clearOnShutdown.cookies
  value: true
- name: privacy.clearOnShutdown.cache
  value: true
- name: privacy.clearOnShutdown.sessions
  value: false
- name: privacy.clearOnShutdown.history
  value: false
- name: privacy.clearOnShutdown.downloads
  value: false
- name: privacy.clearOnShutdown.formdata
  value: false
- name: privacy.clearOnShutdown.offlineApps
  value: true
- name: privacy.clearOnShutdown.siteSettings
  value: false

