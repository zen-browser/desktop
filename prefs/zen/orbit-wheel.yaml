# Orbit Wheel: radial tab switcher, opened with Ctrl+Alt+O
# (Control+Option+O on macOS).
- name: zen.orbit-wheel.enabled
  value: true

# Also take over Ctrl+Tab. Off by default because Zen already owns Ctrl+Tab
# (recently-used order, ignore pending/essential tabs).
- name: zen.orbit-wheel.intercept-ctrl-tab
  value: false

# Show low-resolution live thumbnails of tabs. Kept in memory only.
- name: zen.orbit-wheel.thumbnails
  value: true
