<!DOCTYPE html>
<!-- Unused prototype. Selectable New Tab layouts live in astra-search-hub.html
     (Search Hub) and Zen's URL-bar overlay (Minimal). Do not package this file. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astra — New Tab</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0f1e;
  color: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  user-select: none;
}
.logo {
  font-size: 52px;
  font-weight: 700;
  letter-spacing: 12px;
  color: #ffffff;
  margin-bottom: 8px;
}
.tagline {
  font-size: 14px;
  color: rgba(255,255,255,0.4);
  letter-spacing: 3px;
  margin-bottom: 40px;
  text-transform: uppercase;
}
.search-wrapper {
  width: 560px;
  margin-bottom: 48px;
}
.search-bar {
  width: 100%;
  height: 52px;
  background: rgba(255,255,255,0.08);
  border: 1.5px solid rgba(255,255,255,0.15);
  border-radius: 26px;
  color: #ffffff;
  font-size: 16px;
  padding: 0 24px;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
}
.search-bar::placeholder { color: rgba(255,255,255,0.35); }
.search-bar:focus {
  border-color: rgba(255,255,255,0.5);
  background: rgba(255,255,255,0.12);
}
.quick-links {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 560px;
}
.tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  color: rgba(255,255,255,0.7);
  transition: transform 0.15s, color 0.15s;
  width: 72px;
}
.tile:hover { transform: translateY(-3px); color: #ffffff; }
.tile-icon {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 600;
  transition: background 0.15s, border-color 0.15s;
}
.tile:hover .tile-icon {
  background: rgba(255,255,255,0.15);
  border-color: rgba(255,255,255,0.25);
}
.tile-name { font-size: 11px; text-align: center; }
.clock {
  position: fixed;
  bottom: 24px;
  right: 28px;
  font-size: 13px;
  color: rgba(255,255,255,0.35);
  letter-spacing: 1px;
}
.footer {
  position: fixed;
  bottom: 24px;
  left: 28px;
  font-size: 12px;
  color: rgba(255,255,255,0.2);
  letter-spacing: 1px;
}
</style>
</head>
<body>
<div class="logo">ASTRA</div>
<div class="tagline">India's Browser</div>
<div class="search-wrapper">
  <input class="search-bar" id="search" type="text"
    placeholder="Search or type a URL..." autocomplete="off" />
</div>
<div class="quick-links">
  <a class="tile" href="https://google.com">
    <div class="tile-icon">G</div>
    <div class="tile-name">Google</div>
  </a>
  <a class="tile" href="https://youtube.com">
    <div class="tile-icon">Y</div>
    <div class="tile-name">YouTube</div>
  </a>
  <a class="tile" href="https://mail.google.com">
    <div class="tile-icon">M</div>
    <div class="tile-name">Gmail</div>
  </a>
  <a class="tile" href="https://web.whatsapp.com">
    <div class="tile-icon">W</div>
    <div class="tile-name">WhatsApp</div>
  </a>
  <a class="tile" href="https://digilocker.gov.in">
    <div class="tile-icon">D</div>
    <div class="tile-name">DigiLocker</div>
  </a>
  <a class="tile" href="https://irctc.co.in">
    <div class="tile-icon">R</div>
    <div class="tile-name">IRCTC</div>
  </a>
</div>
<div class="clock" id="clock"></div>
<div class="footer">Astra Browser &middot; India First</div>
<script>
document.getElementById('search').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && this.value.trim()) {
    const q = this.value.trim();
    const isURL = /^(https?:\/\/|www\.)/i.test(q) || /\.[a-z]{2,}(\/.*)?\s*$/i.test(q);
    window.location.href = isURL
      ? (q.startsWith('http') ? q : 'https://' + q)
      : 'https://www.google.com/search?q=' + encodeURIComponent(q);
  }
});
document.getElementById('search').focus();
function updateClock() {
  const now = new Date();
  const opt = { timeZone: 'Asia/Kolkata', hour: 'numeric',
    minute: '2-digit', hour12: true };
  document.getElementById('clock').textContent =
    new Intl.DateTimeFormat('en-IN', opt).format(now) + ' IST';
}
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
