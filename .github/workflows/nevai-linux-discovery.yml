name: Nevai Linux Discovery

permissions:
  contents: read
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"
  NEVAI_LINUX_BUILD_LOG: /tmp/nevai-linux-build.log
  NEVAI_LINUX_LOG_DIR: /tmp/nevai-linux-discovery-logs
  NEVAI_LINUX_BUILD_STATUS_FILE: /tmp/nevai-linux-discovery-logs/build-status.txt

on:
  workflow_dispatch:

concurrency:
  group: nevai-linux-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-discovery:
    name: Linux build discovery
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show runner resources
        run: |
          set -euxo pipefail

          echo "== System =="
          uname -a

          echo
          echo "== Disk =="
          df -h

          echo
          echo "== Memory =="
          free -h

          echo
          echo "== CPU =="
          nproc

          echo
          echo "== Workspace =="
          pwd
          ls -la

      - name: Free runner disk space
        run: |
          set -euxo pipefail

          echo "== Disk before cleanup =="
          df -h

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          echo "== Disk after cleanup =="
          df -h

      - name: Install basic system packages
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            git \
            python3 \
            python3-pip \
            python3-venv \
            unzip \
            zip \
            tar \
            xz-utils \
            ripgrep \
            ccache \
            libgtk-3-dev \
            libdbus-glib-1-dev \
            libxt-dev \
            libx11-xcb-dev \
            libasound2-dev \
            libpulse-dev \
            yasm \
            nasm \
            xvfb

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@main
        with:
          disable_annotations: true

      - name: Expose Actions cache variables for sccache
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'])
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'])

      - name: Source smoke check
        run: |
          set -euxo pipefail
          ./scripts/check-nevai-stage2-source.sh

      - name: Install npm dependencies
        run: |
          set -euxo pipefail
          npm ci

      - name: Download Firefox source
        run: |
          set -euxo pipefail
          npm run download

      - name: Bootstrap
        run: |
          set -euxo pipefail
          npm run bootstrap

      - name: Generate Firefox prefs
        run: |
          set -euxo pipefail
          npm run ffprefs

      - name: Update service dumps
        run: |
          set -euxo pipefail
          python3 scripts/update_service_dumps.py

      - name: Surfer import
        run: |
          set -euxo pipefail
          npm run surfer -- import

      - name: Install cbindgen
        run: |
          set -euxo pipefail

          cargo install --force cbindgen

          which cbindgen
          cbindgen --version

      - name: Create Linux discovery mozconfig
        run: |
          set -euxo pipefail

          MOZCONFIG_FILE="$PWD/engine/mozconfig-nevai-linux-discovery"

          cat > "$MOZCONFIG_FILE" <<EOF
          # Nevai Linux discovery mozconfig.
          # This is CI discovery-only, not final release hardening.

          ac_add_options --with-app-name=nevai
          ac_add_options --with-app-basename=Nevai
          ac_add_options --with-l10n-base=\${topsrcdir}/browser/locales
          ac_add_options --with-distribution-id=app.nevai.browser
          ac_add_options --enable-application=browser
          ac_add_options --disable-updater
          ac_add_options --enable-jxl
          ac_add_options --with-unsigned-addon-scopes=app,system
          ac_add_options --disable-debug
          ac_add_options --with-branding=browser/branding/unofficial
          ac_add_options --enable-update-channel=unofficial
          ac_add_options --with-ccache=sccache

          # Discovery-only bypass for GitHub hosted Ubuntu missing WASI sysroot.
          ac_add_options --without-wasm-sandboxed-libraries

          # Keep GitHub-hosted runner resource use predictable during discovery.
          mk_add_options MOZ_MAKE_FLAGS="-j3"
          mk_add_options 'export RUSTC_WRAPPER=sccache'
          mk_add_options 'export SCCACHE_GHA_ENABLED=true'

          export MOZ_APP_BASENAME=Nevai
          export MOZ_APP_VENDOR=Nevai
          export MOZ_BRANDING_DIRECTORY=browser/branding/unofficial
          export MOZ_OFFICIAL_BRANDING_DIRECTORY=browser/branding/unofficial
          export MOZ_SOURCE_REPO=https://github.com/zen-browser/desktop
          export MOZ_SOURCE_CHANGESET=${GITHUB_SHA}
          export MOZ_INCLUDE_SOURCE_INFO=1
          export MOZ_APPUPDATE_HOST=updates.invalid
          export ZEN_FIREFOX_VERSION=150.0.2
          EOF

          echo "== Linux discovery mozconfig =="
          cat "$MOZCONFIG_FILE"

      - name: Inspect before Linux build
        run: |
          set -euxo pipefail

          echo "== Engine obj dirs before build =="
          find engine -maxdepth 2 -type d -name 'obj-*' -print || true

          echo
          echo "== Tool versions =="
          rustc --version
          cargo --version
          cbindgen --version
          sccache --version || true
          clang --version || true
          clang++ --version || true
          python3 --version
          node --version
          npm --version

          echo
          echo "== Disk before build =="
          df -h

      - name: Build Linux with heartbeat and summarized failure output
        run: |
          set -uxo pipefail

          mkdir -p "$NEVAI_LINUX_LOG_DIR"
          rm -f "$NEVAI_LINUX_BUILD_LOG"
          rm -f "$NEVAI_LINUX_BUILD_STATUS_FILE"

          MOZCONFIG_FILE="$PWD/engine/mozconfig-nevai-linux-discovery"

          echo "== Starting direct Linux discovery build =="
          echo "Using MOZCONFIG: $MOZCONFIG_FILE"
          echo "Full build log: $NEVAI_LINUX_BUILD_LOG"
          sccache --start-server || true
          sccache --show-stats || true

          heartbeat() {
            while true; do
              sleep 300

              echo
              echo "== Linux build heartbeat =="
              df -h "$GITHUB_WORKSPACE" || true

              if [ -f "$NEVAI_LINUX_BUILD_LOG" ]; then
                echo "Build log size:"
                wc -l "$NEVAI_LINUX_BUILD_LOG" || true
                du -h "$NEVAI_LINUX_BUILD_LOG" || true

                echo
                echo "== Recent build log tail =="
                tail -n 80 "$NEVAI_LINUX_BUILD_LOG" || true
              else
                echo "Build log has not been created yet."
              fi
            done
          }

          heartbeat &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT

          cd engine

          set +e
          stdbuf -oL -eL env MOZCONFIG="$MOZCONFIG_FILE" ./mach build 2>&1 | tee "$NEVAI_LINUX_BUILD_LOG"
          status=${PIPESTATUS[0]}
          set -e

          echo "Build timeout: none; GitHub job timeout-minutes remains the outer limit."
          echo "Stall timeout: none; quiet Rust/link phases are allowed to finish."

          echo
          echo "== Build exit code: $status =="
          sccache --show-stats || true

          echo
          echo "== Last 120 lines =="
          tail -n 120 "$NEVAI_LINUX_BUILD_LOG" || true

          echo
          echo "== Strong error candidates =="
          rg -n -C 4 "fatal error:|undefined reference|ld\\.lld: error|collect2: error|gmake(\\[[0-9]+\\])?: \\*\\*\\*|make(\\[[0-9]+\\])?: \\*\\*\\*|FAILED:|error: could not compile|error\\[E[0-9]+\\]|internal compiler error|Killed|signal: 9|No space left on device|recipe for target" "$NEVAI_LINUX_BUILD_LOG" \
            | tail -n 220 || true

          cd "$GITHUB_WORKSPACE"

          {
            echo "# Nevai Linux Discovery Result"
            echo
            echo "**Build exit code:** \`$status\`"
            echo
            echo "## Last 120 lines"
            echo
            echo '```text'
            tail -n 120 "$NEVAI_LINUX_BUILD_LOG" || true
            echo '```'
            echo
            echo "## Strong error candidates"
            echo
            echo '```text'
            rg -n -C 4 "fatal error:|undefined reference|ld\\.lld: error|collect2: error|gmake(\\[[0-9]+\\])?: \\*\\*\\*|make(\\[[0-9]+\\])?: \\*\\*\\*|FAILED:|error: could not compile|error\\[E[0-9]+\\]|internal compiler error|Killed|signal: 9|No space left on device|recipe for target" "$NEVAI_LINUX_BUILD_LOG" \
              | tail -n 220 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "$status" > "$NEVAI_LINUX_BUILD_STATUS_FILE"
          echo "Recorded build status in $NEVAI_LINUX_BUILD_STATUS_FILE"

      - name: Package Linux alpha if build succeeded
        run: |
          set -euxo pipefail

          if [ ! -f "$NEVAI_LINUX_BUILD_STATUS_FILE" ]; then
            echo "Build status file missing; skipping Linux package step."
            exit 0
          fi

          status="$(cat "$NEVAI_LINUX_BUILD_STATUS_FILE")"
          if [ "$status" != "0" ]; then
            echo "Linux build status is $status; skipping Linux package step."
            exit 0
          fi

          ./scripts/package-nevai-linux-alpha.sh

      - name: Upload Linux alpha artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nevai-linux-alpha-dev
          path: |
            ../builds-local/linux/Nevai-linux-alpha-dev.tar.gz
            ../builds-local/linux/Nevai-linux-alpha-dev.SHA256.txt
            ../builds-local/linux/README-alpha.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Collect Linux discovery logs
        if: ${{ always() }}
        run: |
          set -euxo pipefail

          mkdir -p "$NEVAI_LINUX_LOG_DIR"

          if [ -f "$NEVAI_LINUX_BUILD_LOG" ]; then
            cp "$NEVAI_LINUX_BUILD_LOG" "$NEVAI_LINUX_LOG_DIR/nevai-linux-build.log"

            rg -n -C 8 "fatal error:|undefined reference|ld\\.lld: error|collect2: error|gmake(\\[[0-9]+\\])?: \\*\\*\\*|make(\\[[0-9]+\\])?: \\*\\*\\*|FAILED:|error: could not compile|error\\[E[0-9]+\\]|internal compiler error|Killed|signal: 9|No space left on device|recipe for target" "$NEVAI_LINUX_BUILD_LOG" \
              > "$NEVAI_LINUX_LOG_DIR/error-candidates.txt" || true

            tail -n 500 "$NEVAI_LINUX_BUILD_LOG" > "$NEVAI_LINUX_LOG_DIR/build-log-tail.txt" || true
          fi

          echo "== Build output candidates =="
          {
            echo "== Engine obj dirs =="
            find engine -maxdepth 2 -type d -name 'obj-*' -print || true

            echo
            echo "== Possible dist/bin =="
            find engine -path '*/dist/bin' -type d -print || true

            echo
            echo "== Possible app files =="
            find engine \
              -path '*/dist/bin/application.ini' -o \
              -path '*/dist/bin/nevai' -o \
              -path '*/dist/bin/firefox' -o \
              -path '*/dist/bin/zen' \
              2>/dev/null || true

            echo
            echo "== Disk =="
            df -h

            echo
            echo "== Largest directories =="
            du -h -d 2 . 2>/dev/null | sort -hr | head -n 80 || true
          } | tee "$NEVAI_LINUX_LOG_DIR/build-output-candidates.txt"

          echo
          echo "== Collected log files =="
          find "$NEVAI_LINUX_LOG_DIR" -maxdepth 10 -type f -print | sort || true

      - name: Upload Linux discovery logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nevai-linux-discovery-logs
          path: /tmp/nevai-linux-discovery-logs
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Inspect build outputs
        if: ${{ always() }}
        run: |
          set -euxo pipefail

          echo "== Engine obj dirs =="
          find engine -maxdepth 2 -type d -name 'obj-*' -print || true

          echo
          echo "== Possible dist/bin =="
          find engine -path '*/dist/bin' -type d -print || true

          echo
          echo "== Possible application files =="
          find engine \
            -path '*/dist/bin/application.ini' -o \
            -path '*/dist/bin/nevai' -o \
            -path '*/dist/bin/firefox' -o \
            -path '*/dist/bin/zen' \
            2>/dev/null || true

          echo
          echo "== Disk after build =="
          df -h

      - name: Fail Linux discovery if build failed
        if: ${{ always() }}
        run: |
          set -euxo pipefail

          if [ ! -f "$NEVAI_LINUX_BUILD_STATUS_FILE" ]; then
            echo "No Linux build status file was written."
            echo "The build step did not run or stopped before recording status; an earlier step should contain the real failure."
            exit 0
          fi

          status="$(cat "$NEVAI_LINUX_BUILD_STATUS_FILE")"
          echo "Linux discovery build status: $status"

          if [ "$status" != "0" ]; then
            exit "$status"
          fi
