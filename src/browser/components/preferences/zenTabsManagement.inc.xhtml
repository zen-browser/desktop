<html:template id="template-paneZenTabManagement">
<hbox id="ZenWorkspacesCategory"
      class="subcategory"
      hidden="true"
      data-category="paneZenTabManagement">
</hbox>

<hbox id="zenTabManagementCategory"
      class="subcategory"
      hidden="true"
      data-category="paneZenTabManagement">
<html:h1 data-l10n-id="pane-settings-workspaces-title"/>
</hbox>

<groupbox id="zenWorkspacesGroup" data-category="paneZenTabManagement" hidden="true" class="highlighting-group">
      <label><html:h2 data-l10n-id="zen-settings-workspaces-header"/></label>
      <description class="description-deemphasized" data-l10n-id="zen-settings-workspaces-description" />

      <checkbox id="zenWorkspacesSyncUnpinnedTabs"
            data-l10n-id="zen-settings-workspaces-sync-unpinned-tabs"
            preference="zen.window-sync.sync-only-pinned-tabs"/>
      <checkbox id="zenWorkspacesHideDefaultContainer"
            data-l10n-id="zen-settings-workspaces-hide-default-container-indicator"
            preference="zen.workspaces.hide-default-container-indicator"/>
      <checkbox id="zenWorkspacesForceContainerTabsToWorkspace"
            data-l10n-id="zen-settings-workspaces-force-container-tabs-to-workspace"
            preference="zen.workspaces.force-container-workspace"/>
      <checkbox id="zenTabsCloseOnBackWithNoHistory"
            data-l10n-id="zen-tabs-close-on-back-with-no-history"
            preference="zen.tabs.close-on-back-with-no-history"/>
      <checkbox data-l10n-id="zen-tabs-cycle-ignore-pending-tabs"
            preference="zen.tabs.ctrl-tab.ignore-pending-tabs"/>
      <checkbox data-l10n-id="zen-tabs-cycle-by-attribute"
            preference="zen.tabs.ctrl-tab.ignore-essential-tabs"/>
      <description id="zenTabsCycleByAttributeWarning"
            class="description-deemphasized"
            data-l10n-id="zen-tabs-cycle-by-attribute-warning"
            hidden="true"/>
      <checkbox data-l10n-id="zen-tabs-select-recently-used-on-close"
            preference="zen.tabs.select-recently-used-on-close"/>
      <checkbox data-l10n-id="zen-tab-unloader-auto-unload-inactive"
            preference="zen.tab-unloader.auto-unload-inactive"/>
      <hbox align="center">
            <label id="zenTabUnloaderAggressivenessLabel" data-l10n-id="zen-tab-unloader-aggressiveness-label"/>
            <menulist id="zenTabUnloaderAggressiveness" preference="zen.tab-unloader.aggressiveness">
                  <menupopup>
                        <menuitem data-l10n-id="zen-tab-unloader-aggressiveness-conservative" value="conservative"/>
                        <menuitem data-l10n-id="zen-tab-unloader-aggressiveness-balanced" value="balanced"/>
                        <menuitem data-l10n-id="zen-tab-unloader-aggressiveness-aggressive" value="aggressive"/>
                  </menupopup>
            </menulist>
      </hbox>
      <hbox align="center">
            <label id="zenTabUnloaderTimeoutLabel" data-l10n-id="zen-tab-unloader-timeout-label"/>
            <menulist id="zenTabUnloaderTimeout" preference="zen.tab-unloader.timeout-minutes">
                  <menupopup>
                        <menuitem label="5 min" value="5"/>
                        <menuitem label="10 min" value="10"/>
                        <menuitem label="20 min" value="20"/>
                        <menuitem label="30 min" value="30"/>
                  </menupopup>
            </menulist>
      </hbox>
      <hbox align="center">
            <label id="zenTabUnloaderHighThresholdLabel" data-l10n-id="zen-tab-unloader-high-threshold-label"/>
            <menulist id="zenTabUnloaderHighThreshold" preference="zen.tab-unloader.high-tab-threshold">
                  <menupopup>
                        <menuitem label="Disabled" value="0"/>
                        <menuitem label="60 tabs" value="60"/>
                        <menuitem label="80 tabs" value="80"/>
                        <menuitem label="120 tabs" value="120"/>
                  </menupopup>
            </menulist>
      </hbox>
      <checkbox id="zenFoldersAccordionMode"
            data-l10n-id="zen-folders-accordion-checkbox"
            preference="zen.folders.accordion-mode"/>
</groupbox>

<hbox id="zenPerformanceCategory"
      class="subcategory"
      hidden="true"
      data-category="paneZenTabManagement">
      <html:h1 data-l10n-id="pane-zen-performance-title"/>
</hbox>

<groupbox id="zenPerformanceGroup" data-category="paneZenTabManagement" hidden="true" class="highlighting-group">
      <label><html:h2 data-l10n-id="zen-performance-header"/></label>
      <description class="description-deemphasized" data-l10n-id="zen-performance-description" />

      <hbox align="center">
            <label id="zenEnergySaverModeLabel" data-l10n-id="zen-energy-saver-mode-label"/>
            <menulist id="zenEnergySaverMode" preference="zen.energy-saver.mode">
                  <menupopup>
                        <menuitem data-l10n-id="zen-energy-saver-mode-auto" value="auto"/>
                        <menuitem data-l10n-id="zen-energy-saver-mode-on" value="on"/>
                        <menuitem data-l10n-id="zen-energy-saver-mode-off" value="off"/>
                  </menupopup>
            </menulist>
      </hbox>
      <description id="zenEnergySaverStatus"
            class="description-deemphasized"
            data-l10n-id="zen-energy-saver-status-inactive"/>

      <description class="description-deemphasized" data-l10n-id="zen-performance-smart-suspend-status"/>
      <description class="description-deemphasized" data-l10n-id="zen-performance-session-restore-status"/>
      <description class="description-deemphasized" data-l10n-id="zen-performance-hw-accel-status"/>
      <description class="description-deemphasized" data-l10n-id="zen-performance-process-isolation-status"/>

      <hbox class="indent">
            <html:button id="zenPerfOpenProcesses"
                  class="accessory-button"
                  data-l10n-id="zen-performance-open-processes"/>
            <html:button id="zenPerfOpenUnloads"
                  class="accessory-button"
                  data-l10n-id="zen-performance-open-unloads"/>
            <html:button id="zenPerfOpenMemory"
                  class="accessory-button"
                  data-l10n-id="zen-performance-open-memory"/>
      </hbox>

      <label><html:h2 data-l10n-id="zen-local-translation-header"/></label>
      <description class="description-deemphasized" data-l10n-id="zen-local-translation-description" />
</groupbox>

<hbox id="zenPinnedTabsManagerCategory"
      class="subcategory"
      hidden="true"
      data-category="paneZenTabManagement">
      <html:h1 data-l10n-id="pane-zen-pinned-tab-manager-title"/>
</hbox>

<groupbox id="zenPinnedTabsManagerGroup" data-category="paneZenTabManagement" hidden="true" class="highlighting-group">
      <label><html:h2 data-l10n-id="zen-pinned-tab-manager-header"/></label>
      <description class="description-deemphasized" data-l10n-id="zen-pinned-tab-manager-description" />

      <checkbox id="zenPinnedTabRestorePinnedTabsToPinnedUrl"
                data-l10n-id="zen-pinned-tab-manager-restore-pinned-tabs-to-pinned-url"
                preference="zen.pinned-tab-manager.restore-pinned-tabs-to-pinned-url"/>
      <checkbox id="zenPinnedTabContainerSpecificEssentials"
                data-l10n-id="zen-pinned-tab-manager-container-specific-essentials-enabled"
                preference="zen.workspaces.separate-essentials"/>

      <hbox align="center">
            <label id="zenPinnedTabCloseShortcutBehaviorLabel" data-l10n-id="zen-pinned-tab-manager-close-shortcut-behavior-label"/>
            <menulist id="zenPinnedTabCloseShortcutBehavior" preference="zen.pinned-tab-manager.close-shortcut-behavior">
                  <menupopup>
                        <menuitem data-l10n-id="zen-pinned-tab-manager-reset-unload-switch-close-shortcut-option" value="reset-unload-switch"/>
                        <menuitem data-l10n-id="zen-pinned-tab-manager-unload-switch-close-shortcut-option" value="unload-switch"/>
                        <menuitem data-l10n-id="zen-pinned-tab-manager-reset-switch-close-shortcut-option" value="reset-switch"/>
                        <menuitem data-l10n-id="zen-pinned-tab-manager-switch-close-shortcut-option" value="switch"/>
                        <menuitem data-l10n-id="zen-pinned-tab-manager-reset-close-shortcut-option" value="reset"/>
                        <menuitem data-l10n-id="zen-pinned-tab-manager-close-close-shortcut-option" value="close"/>
                  </menupopup>
            </menulist>
      </hbox>
</groupbox>

</html:template>
