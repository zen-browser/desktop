<html:div id="zen-vim-commandline" class="zen-vim-commandline" hidden="true">
  <html:div class="zen-vim-commandline-inner">
    <html:span id="zen-vim-commandline-prompt" class="zen-vim-commandline-prompt">:</html:span>
    <html:input
      id="zen-vim-commandline-input"
      class="zen-vim-commandline-input"
      type="text"
      autocomplete="off"
      spellcheck="false" />
  </html:div>
  <html:div
    id="zen-vim-commandline-suggest"
    class="zen-vim-commandline-suggest"
    hidden="true">
    <html:div
      id="zen-vim-commandline-suggest-list"
      class="zen-vim-commandline-suggest-list"></html:div>
  </html:div>
</html:div>
