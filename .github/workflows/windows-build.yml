# Cross-compiled Windows release binaries on Ubuntu (same approach as upstream release CI).
# Triggers manually or on version tags. PGO is disabled for faster, simpler CI.
name: Windows Build

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      brand:
        description: Surfer brand to build
        required: true
        type: choice
        default: release
        options:
          - release
          - twilight
      include_arm64:
        description: Also build Windows on ARM64 (longer run, more disk)
        required: false
        type: boolean
        default: false
      use_sccache:
        description: Enable sccache (recommended for repeat builds)
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      arch: ${{ steps.matrix.outputs.arch }}
    steps:
      - id: matrix
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.include_arm64 }}" == "true" ]]; then
            echo 'arch=["x86_64","aarch64"]' >> "$GITHUB_OUTPUT"
          else
            echo 'arch=["x86_64"]' >> "$GITHUB_OUTPUT"
          fi

  windows-build:
    name: Windows ${{ matrix.arch }}
    needs: resolve-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.resolve-matrix.outputs.arch) }}
    env:
      SCCACHE_GHA_ENABLED: ${{ (github.event_name == 'push' || inputs.use_sccache) && 'true' || 'false' }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      BRAND: ${{ github.event_name == 'workflow_dispatch' && inputs.brand || 'release' }}

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Enable sccache
        if: env.SCCACHE_GHA_ENABLED == 'true'
        uses: mozilla-actions/sccache-action@main

      - name: Expose Actions cache variables for sccache
        if: env.SCCACHE_GHA_ENABLED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable(
              "ACTIONS_CACHE_URL",
              process.env.ACTIONS_CACHE_URL
            );
            core.exportVariable(
              "ACTIONS_RUNTIME_TOKEN",
              process.env.ACTIONS_RUNTIME_TOKEN
            );

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip dos2unix yasm nasm build-essential \
            libgtk2.0-dev libpython3-dev m4 uuid libasound2-dev \
            libcurl4-openssl-dev libdbus-1-dev libdrm-dev libdbus-glib-1-dev \
            libgtk-3-dev libpulse-dev libx11-xcb-dev libxt-dev xvfb lld llvm \
            --fix-missing

      - name: Load Surfer CI setup
        run: |
          VERSION="$(npm run --silent surfer -- get version | tr -d '\r\n')"
          npm run surfer -- ci --brand "$BRAND" --display-version "$VERSION"

      - name: Download Firefox and dependencies
        run: npm run download

      - name: Cache win-cross toolchain
        id: cache-win-cross
        uses: actions/cache@v4
        with:
          path: ~/win-cross
          key: win-cross-${{ runner.os }}-v1

      - name: Setup Windows cross toolchain
        if: steps.cache-win-cross.outputs.cache-hit != 'true'
        run: |
          set -x
          mkdir -p ~/win-cross
          cd engine/
          sudo apt-get install -y python3-launchpadlib
          sudo add-apt-repository -y ppa:savoury1/backports
          sudo apt-get update
          sudo apt-get install -y \
            autoconf autoconf2.13 automake bison build-essential cabextract curl cmake \
            flex gawk gcc-multilib git gnupg jq libbz2-dev libexpat1-dev libffi-dev \
            libncursesw5-dev libsqlite3-dev libssl-dev libtool libucl-dev libxml2-dev \
            msitools ninja-build openssh-client p7zip-full pkg-config procps \
            python3-requests python3-toml scons subversion tar unzip uuid uuid-dev \
            wget zip zlib1g-dev aria2
          aria2c "https://firefox-ci-tc.services.mozilla.com/api/index/v1/task/gecko.cache.level-3.toolchains.v3.linux64-wine.latest/artifacts/public/build/wine.tar.zst" \
            -o wine.tar.zst
          tar --zstd -xf wine.tar.zst -C ~/win-cross
          rm wine.tar.zst
          ./mach python --virtualenv build taskcluster/scripts/misc/get_vs.py build/vs/vs2026.yaml ~/win-cross/vs2026

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain "$(cat .rust-toolchain)"
          # shellcheck disable=SC1090
          . "$HOME/.cargo/env"
          if test "${{ matrix.arch }}" = "aarch64"; then
            rustup target add aarch64-pc-windows-msvc
          else
            rustup target add x86_64-pc-windows-msvc
          fi

      - name: Import patches
        env:
          SURFER_COMPAT: ${{ matrix.arch }}
          SURFER_CERT_PATCH_ISSUER: ${{ secrets.SURFER_CERT_PATCH_ISSUER }}
          SURFER_CERT_PATCH_NAME: ${{ secrets.SURFER_CERT_PATCH_NAME }}
          SURFER_CERT_PATCH_NAME_PREV: ${{ secrets.SURFER_CERT_PATCH_NAME_PREV }}
          SURFER_CERT_PATCH_ISSUER_PREV: ${{ secrets.SURFER_CERT_PATCH_ISSUER_PREV }}
        run: |
          # shellcheck disable=SC1090
          . "$HOME/.cargo/env"
          npm run import -- --verbose

      - name: Bootstrap
        run: |
          set -x
          cd engine/
          chmod -R +x "$(echo ~)/win-cross/vs2026" || true
          cd ..
          export SURFER_PLATFORM=win32
          npm run bootstrap
          cd engine/
          echo "export LIB=\"$(cd ~/.mozbuild/clang/lib/clang/* && cd lib/windows && pwd)\"" >> ../configs/common/mozconfig

      - name: Fetch windows-rs
        run: |
          # shellcheck disable=SC1090
          . "$HOME/.cargo/env"
          WINDOWS_RS_VERSION="$(cat build/windows/.windows-rs-version)"
          curl -fsSL "https://static.crates.io/crates/cargo-download/cargo-download-0.1.2.crate" | tar xz -C /tmp
          (cd /tmp/cargo-download-0.1.2 && cargo generate-lockfile && cargo update tinyvec --precise 1.12.0)
          RUSTFLAGS="--cap-lints=allow" cargo install --path /tmp/cargo-download-0.1.2 --locked
          cd engine/
          cargo download -x "windows=$WINDOWS_RS_VERSION"
          echo "" >> ../configs/common/mozconfig
          echo "export MOZ_WINDOWS_RS_DIR=$(pwd)/windows-$WINDOWS_RS_VERSION" >> ../configs/common/mozconfig

      - name: Build language packs
        run: sh scripts/download-language-packs.sh

      - name: Build
        env:
          SURFER_COMPAT: ${{ matrix.arch }}
          ZEN_RELEASE_BRANCH: ${{ env.BRAND }}
          ZEN_GA_DISABLE_PGO: "1"
          ZEN_SAFEBROWSING_API_KEY: ${{ secrets.ZEN_SAFEBROWSING_API_KEY }}
          ZEN_MOZILLA_API_KEY: ${{ secrets.ZEN_MOZILLA_API_KEY }}
        run: |
          set -x
          dos2unix configs/windows/mozconfig
          export SURFER_PLATFORM=win32
          export ZEN_CROSS_COMPILING=1
          bash .github/workflows/src/release-build.sh

      - name: Package
        env:
          SURFER_COMPAT: ${{ matrix.arch }}
          ZEN_GA_DISABLE_PGO: "1"
        run: |
          set -x
          export SURFER_PLATFORM=win32
          export ZEN_CROSS_COMPILING=1
          export ZEN_RELEASE=1
          npm run package
          ARCH_SUFFIX=""
          if test "${{ matrix.arch }}" = "aarch64"; then
            ARCH_SUFFIX="-aarch64"
          fi
          VERSION="$(npm run --silent surfer -- get version | tr -d '\r\n')"
          ARCH_LABEL="${{ matrix.arch == 'aarch64' && 'arm64' || 'x86_64' }}"
          INSTALLER_SUFFIX="${{ matrix.arch == 'aarch64' && '-arm64' || '' }}"
          mv "./dist/peppermint-${VERSION}.en-US.win64${ARCH_SUFFIX}.zip" \
            "peppermint.win-${ARCH_LABEL}.zip"
          mv ./dist/output.mar "windows${{ matrix.arch == 'aarch64' && '-arm64' || '' }}.mar"
          mv ./dist/peppermint.installer.exe "./Peppermint-Setup${INSTALLER_SUFFIX}.exe"

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: peppermint.win-${{ matrix.arch == 'aarch64' && 'arm64' || 'x86_64' }}
          path: peppermint.win-${{ matrix.arch == 'aarch64' && 'arm64' || 'x86_64' }}.zip
          retention-days: 14

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Peppermint-Setup${{ matrix.arch == 'aarch64' && '-arm64' || '' }}.exe
          path: Peppermint-Setup${{ matrix.arch == 'aarch64' && '-arm64' || '' }}.exe
          retention-days: 14

      - name: Upload update MAR
        uses: actions/upload-artifact@v4
        with:
          name: windows${{ matrix.arch == 'aarch64' && '-arm64' || '' }}.mar
          path: windows${{ matrix.arch == 'aarch64' && '-arm64' || '' }}.mar
          retention-days: 14
