- name: zen.mods.auto-update-days
  value: 20 # In days

- name: zen.mods.auto-update
  value: "@cond"
  condition: "defined(MOZILLA_OFFICIAL)"

# Mod scripts run with every power the browser has; only local mods have them.
- name: zen.mods.scripts.enabled
  value: false

# Mod files are only downloaded from these prefixes.
- name: zen.mods.store-url
  value: "https://zen-browser.github.io/theme-store/"
  locked: true
  condition: "defined(MOZILLA_OFFICIAL)"

- name: zen.mods.store-url
  value: "https://zen-browser.github.io/theme-store/"
  condition: "!defined(MOZILLA_OFFICIAL)"

- name: zen.mods.store-assets-url
  value: "https://raw.githubusercontent.com/zen-browser/theme-store/"
  locked: true
  condition: "defined(MOZILLA_OFFICIAL)"

- name: zen.mods.store-assets-url
  value: "https://raw.githubusercontent.com/zen-browser/theme-store/"
  condition: "!defined(MOZILLA_OFFICIAL)"

# === Mark: Site Injection ===

- name: zen.injections.match-urls
  value: "https://zen-browser.app/*"
  locked: true
  condition: "defined(MOZILLA_OFFICIAL)"

- name: zen.injections.match-urls
  value: "http://localhost/*"
  condition: "!defined(MOZILLA_OFFICIAL)"
