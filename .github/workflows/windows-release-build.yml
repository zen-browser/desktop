name: Windows Release Build

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      generate-gpo:
        required: true
        type: boolean
        default: false
      build-version:
        description: "The version to build"
        required: true
        type: string
      profile-data-path-archive:
        description: "The path to the zip archive containing the profile data"
        type: string
      release-branch:
        description: "The branch to build"
        required: true
        type: string
      MOZ_BUILD_DATE:
        type: string
        required: true
        default: ""
      use-sccache:
        description: "Use sccache"
        required: true
        type: boolean
        default: false

jobs:
  windows-build:
    name: Build Windows - ${{ matrix.arch }}
    # aarch64 does not need full 16x, and we also dont use full LTO when generating GPO
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: ${{ inputs['use-sccache'] && 'true' || 'false' }}
      SCCACHE_IDLE_TIMEOUT: "0"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: ${{ inputs['use-sccache'] && 'sccache' || '' }}
      CARGO_INCREMENTAL: 0
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        if: ${{ runner.os == 'Linux' && !(inputs['generate-gpo'] && matrix.arch == 'aarch64') }}
        with:
          tool-cache: false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main
        continue-on-error: true
        if: ${{ inputs['use-sccache'] }}
        with:
          disable_annotations: true

      - name: Expose actions cache variables
        uses: actions/github-script@v6
        continue-on-error: true
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'])
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'])

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          npm ci

      - name: Load Surfer CI setup
        run: npm run surfer -- ci --brand ${{ inputs['release-branch'] }} --display-version ${{ inputs['build-version'] }}

      - name: Validate jar manifest paths
        if: ${{ !(inputs['generate-gpo'] && matrix.arch == 'aarch64') }}
        run: python scripts/validate_jar_manifest.py

      - name: Validate installer branding assets
        run: python scripts/check_installer_branding.py

      - name: Download Firefox and dependencies
        if: ${{ !(inputs['generate-gpo'] && matrix.arch == 'aarch64') }}
        run: npm run download

      - name: win-cross Cache
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5
        id: cache-win-cross
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/win-cross
          key: win-cross

      - name: Install MozillaBuild
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe" -OutFile "MozillaBuildSetup.exe"
          Start-Process -FilePath "MozillaBuildSetup.exe" -ArgumentList "/S" -Wait
          $env:MOZILLABUILD = "C:\mozilla-build"
          Add-Content -Path $env:GITHUB_ENV -Value "MOZILLABUILD=C:\mozilla-build"

      - name: Setup for Windows
        if: steps.cache-win-cross.outputs.cache-hit != 'true' && !(inputs['generate-gpo'] && matrix.arch == 'aarch64')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}/win-cross" | Out-Null
          Set-Location engine
          Write-Output "Setup wine"
          Invoke-WebRequest "https://firefox-ci-tc.services.mozilla.com/api/index/v1/task/gecko.cache.level-1.toolchains.v3.linux64-wine.latest/artifacts/public%2Fbuild%2Fwine.tar.zst" -OutFile "wine.tar.zst"
          tar -xf "wine.tar.zst" -C "${{ runner.temp }}/win-cross"
          Remove-Item "wine.tar.zst" -Force
          Write-Output "Setup Visual Studio"
          python mach python --virtualenv build taskcluster/scripts/misc/get_vs.py build/vs/vs2026.yaml "${{ runner.temp }}/win-cross/vs2026"

      - name: Import
        if: ${{ !(inputs['generate-gpo'] && matrix.arch == 'aarch64') }}
        env:
          SURFER_COMPAT: ${{ matrix.arch }}
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          npm run import -- --verbose

      - name: Bootstrap
        if: ${{ !(inputs['generate-gpo'] && matrix.arch == 'aarch64') }}
        shell: bash
        run: |
          set -x
          cd engine/
          chmod -R +x "${{ runner.temp }}/win-cross/vs2026" || true
          cd ..
          export SURFER_PLATFORM="win32"
          npm run bootstrap
          cd engine/
          ls ~/.mozbuild/clang/lib/clang/
          CLANG_DIR=$(ls -d ~/.mozbuild/clang/lib/clang/*/  2>/dev/null | head -1)
          if [ -z "$CLANG_DIR" ]; then
            CLANG_DIR=$(find ~/.mozbuild/clang/lib/clang -maxdepth 1 -type d | tail -1)/
          fi
          if [ -n "$CLANG_DIR" ]; then
            echo "export LIB=\"${CLANG_DIR}lib/windows\"" >> ../configs/common/mozconfig
          fi
          cat ../configs/common/mozconfig || true
          ls "${{ runner.temp }}/win-cross/wine" || true
          ls "${{ runner.temp }}/win-cross/vs2026" || true

      - name: Setup Rust
        if: ${{ !(inputs['generate-gpo'] && matrix.arch == 'aarch64') }}
        shell: pwsh
        run: |
          $toolchain = (Get-Content .rust-toolchain -Raw).Trim()
          Invoke-WebRequest "https://win.rustup.rs/x86_64" -OutFile "rustup-init.exe"
          .\rustup-init.exe -y --default-toolchain $toolchain
          $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
          if ("${{ matrix.arch }}" -eq "aarch64") {
            rustup target add aarch64-pc-windows-msvc
          } else {
            rustup target add x86_64-pc-windows-msvc
          }
          # Stored in build/windows/.windows-rs-version
          $WINDOWS_RS_VERSION = (Get-Content build/windows/.windows-rs-version -Raw).Trim()
          Set-Location engine
          cargo install cargo-download --locked
          cargo download -x windows=$WINDOWS_RS_VERSION
          $env:CARGO_INCREMENTAL = "0"
          $MOZ_RS_PATH = (Get-Location).Path -replace '\\', '/'
          Add-Content ..\configs\common\mozconfig ""
          Add-Content ..\configs\common\mozconfig "export MOZ_WINDOWS_RS_DIR=$MOZ_RS_PATH/windows-$WINDOWS_RS_VERSION"

      - name: Build language packs
        continue-on-error: true
        if: ${{ !(inputs['generate-gpo'] && matrix.arch == 'aarch64') }}
        shell: bash
        run: bash scripts/download-language-packs.sh

      - name: Download artifact (if use profdata)
        uses: actions/download-artifact@v4
        continue-on-error: true
        if: ${{ !inputs['generate-gpo'] && matrix.arch == 'x86_64' }}
        with:
          path: ~/artifact
          name: windows-profdata-${{ matrix.arch == 'aarch64' && 'arm64' || matrix.arch }}

      - name: Show artifact info
        continue-on-error: true
        if: ${{ !inputs['generate-gpo'] && matrix.arch == 'x86_64' }}
        shell: bash
        run: |
          ls ~/artifact
          ls ~/artifact/en-US.log
          ls ~/artifact/merged.profdata
          chmod +x ~/artifact/en-US.log
          chmod +x ~/artifact/merged.profdata

      - name: Insert API Keys
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.zen-keys"
          $key = "${{ secrets.ZEN_SAFEBROWSING_API_KEY }}"
          if ([string]::IsNullOrWhiteSpace($key)) { $key = "placeholder" }
          Set-Content -Path "$env:USERPROFILE\.zen-keys\safebrowsing.dat" -Value $key

          # Also create for MSYS/bash path
          $msysPath = $env:USERPROFILE -replace 'C:\\', '/c/' -replace '\\', '/'
          bash -c "mkdir -p $msysPath/.zen-keys && echo '$key' > $msysPath/.zen-keys/safebrowsing.dat"

      - name: Build
        if: ${{ !(inputs['generate-gpo'] && matrix.arch == 'aarch64') }}
        env:
          SURFER_COMPAT: ${{ matrix.arch }}
          ZEN_RELEASE_BRANCH: ${{ inputs['release-branch'] }}
        shell: pwsh
        run: |
          $env:SURFER_PLATFORM = "win32"
          if ("${{ inputs['generate-gpo'] }}" -eq "true") {
            $env:ZEN_GA_GENERATE_PROFILE = "1"
          }
          if ("${{ inputs.MOZ_BUILD_DATE }}" -ne "") {
            $env:MOZ_BUILD_DATE = "${{ inputs.MOZ_BUILD_DATE }}"
          }
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          $env:CARGO_HOME = "$env:USERPROFILE\.cargo"
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.cargo" | Out-Null
          $env:WIN32_REDIST_DIR = "${{ runner.temp }}\win-cross\vs2026\VC\Redist\MSVC\14.50.35710\x64\Microsoft.VC145.CRT"
          bash .github/workflows/src/release-build.sh

      - name: Stage uBlock + policies into dist/bin/distribution (pre-package)
        if: ${{ !(inputs['generate-gpo'] && matrix.arch == 'aarch64') }}
        shell: bash
        run: |
          set -eux
          OBJ_DIR="engine/obj-${{ matrix.arch }}-pc-windows-msvc"
          DIST_DIR="$OBJ_DIR/dist/bin/distribution"
          mkdir -p "$DIST_DIR/extensions"
          # uBlock XPI - drop into distribution/extensions/ so Firefox enterprise
          # extension loading picks it up at first run.
          curl -fsSL --retry 3 \
            "https://github.com/gorhill/uBlock/releases/download/1.62.0/uBlock0_1.62.0.firefox.signed.xpi" \
            -o "$DIST_DIR/extensions/uBlock0@raymondhill.net.xpi"
          test -s "$DIST_DIR/extensions/uBlock0@raymondhill.net.xpi"
          # policies.json - enterprise policies for force_installed + Locked
          cp build/AppDir/distribution/policies.json "$DIST_DIR/policies.json"
          test -s "$DIST_DIR/policies.json"
          echo "--- dist/bin/distribution tree staged before mach package ---"
          find "$DIST_DIR" -type f -printf '%p (%s bytes)\n'
          echo "package-manifest.in patch will include @BINPATH@/distribution/* on XP_WIN,"
          echo "so stage-package + make installer will bundle these into the EXE."

      - name: Package
        if: ${{ !(inputs['generate-gpo'] && matrix.arch == 'aarch64') }}
        env:
          SURFER_COMPAT: ${{ matrix.arch }}
          ZEN_RELEASE_BRANCH: ${{ inputs['release-branch'] }}
        shell: pwsh
        run: |
          $env:SURFER_PLATFORM = "win32"
          $env:ZEN_RELEASE = "1"
          $env:ZEN_GA_DISABLE_PGO = "true"
          $env:MOZ_DISABLE_MAR_CERT_VERIFICATION = "1"
          $env:ACCEPTED_MAR_CHANNEL_IDS = "firefox-mozilla-central"
          $env:MAR_CHANNEL_ID = "firefox-mozilla-central"
          npm run package
          Write-Host "Package step completed"
          bash -c 'ls ./dist/ || true; echo "Installer check:"; ls ./dist/zen.installer.exe || echo "No installer found"'
          if (Test-Path "./dist/zen.installer.exe") {
            Write-Host "SUCCESS: Installer found!"
          } else {
            Write-Host "WARNING: Installer not at dist/zen.installer.exe"
            Write-Host "Rename step will search all paths"
            Get-ChildItem ./dist/ -ErrorAction SilentlyContinue
          }
          exit 0

      - name: Verify uBlock + policies inside packaged installer and zip
        if: ${{ !(inputs['generate-gpo'] && matrix.arch == 'aarch64') }}
        shell: bash
        run: |
          set -eux
          OBJ_DIR="engine/obj-${{ matrix.arch }}-pc-windows-msvc"

          INSTALLER=$(find "$OBJ_DIR/dist" -type f -name "*.installer*.exe" 2>/dev/null | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "::error::No installer .exe produced under $OBJ_DIR/dist"
            exit 1
          fi
          echo "Inspecting installer: $INSTALLER"
          if 7z l "$INSTALLER" 2>/dev/null | grep -qi "uBlock0@raymondhill.net.xpi"; then
            echo "uBlock XPI confirmed inside installer EXE"
          else
            echo "::error::uBlock XPI MISSING from installer EXE: $INSTALLER"
            exit 1
          fi
          if 7z l "$INSTALLER" 2>/dev/null | grep -qi "policies.json"; then
            echo "policies.json confirmed inside installer EXE"
          else
            echo "::error::policies.json MISSING from installer EXE: $INSTALLER"
            exit 1
          fi

          # Only inspect the user-facing distribution ZIP, not internal build
          # artifacts like *xpt_artifacts*.zip, *crashreporter-symbols*.zip,
          # *.tests.zip, *langpack*.zip etc. The Rename step also uses the
          # narrower `*.win64.zip` glob, which is the correct distribution name.
          ZIP=$(find "$OBJ_DIR/dist" -type f -name "*.win*.zip" \
            ! -name "*xpt_artifacts*" \
            ! -name "*crashreporter*" \
            ! -name "*tests*" \
            ! -name "*langpack*" \
            ! -name "*mozharness*" \
            2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "::warning::No user-facing distribution ZIP found under $OBJ_DIR/dist (internal artifacts excluded)."
            echo "Installer EXE is the primary deliverable and was verified above - ZIP check skipped."
          else
            echo "Inspecting zip: $ZIP"
            if 7z l "$ZIP" 2>/dev/null | grep -qi "uBlock0@raymondhill.net.xpi"; then
              echo "uBlock XPI confirmed inside zip"
            else
              echo "::warning::uBlock XPI not found inside ZIP: $ZIP (non-fatal - installer EXE is the primary deliverable)"
            fi
            if 7z l "$ZIP" 2>/dev/null | grep -qi "policies.json"; then
              echo "policies.json confirmed inside zip"
            else
              echo "::warning::policies.json not found inside ZIP: $ZIP (non-fatal - installer EXE is the primary deliverable)"
            fi
          fi

      - name: Remove API Keys
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "$env:USERPROFILE\.zen-keys" -ErrorAction SilentlyContinue

      - name: Move package for PGO upload
        continue-on-error: true
        if: ${{ inputs['generate-gpo'] && matrix.arch == 'x86_64' }}
        shell: bash
        run: |
          set -x
          ZEN_ZIP=$(ls ./dist/*.win64.zip 2>/dev/null | head -1)
          if [ -n "$ZEN_ZIP" ]; then
            cp "$ZEN_ZIP" ./zen.win64-pgo-stage-1.zip
          fi

      - name: Debug files
        shell: bash
        run: |
          echo "=== dist/ ==="
          ls ./dist/ 2>/dev/null || echo "no dist"
          echo "=== root ==="
          ls . 2>/dev/null
          echo "=== engine/obj dist ==="
          ls "engine/obj-${{ matrix.arch }}-pc-windows-msvc/dist/" 2>/dev/null || true

      - name: Copy installer to root
        continue-on-error: true
        shell: bash
        run: |
          set -x
          OBJ_DIR="engine/obj-${{ matrix.arch }}-pc-windows-msvc"
          DIST_DIR="$OBJ_DIR/dist"

          # Prefer known installer filenames from dist, fallback to broader obj search
          INSTALLER=$(find "$DIST_DIR" -type f \( \
            -name "zen.installer.exe" \
            -o -name "zen.installer-arm64.exe" \
            -o -name "setup.exe" \
            -o -name "*.installer.exe" \
            \) 2>/dev/null | head -1)
          if [ -z "$INSTALLER" ]; then
            INSTALLER=$(find "$OBJ_DIR" -type f -name "*.exe" -not -name "*.pdb" 2>/dev/null | head -1)
          fi

          if [ -n "$INSTALLER" ]; then
            cp "$INSTALLER" ./dist/zen.installer.exe
            echo "Copied: $INSTALLER"
          fi

          # Also find zip in obj dist output
          ZIP=$(find "$DIST_DIR" -type f -name "*.win*.zip" 2>/dev/null | head -1)

          if [ -n "$ZIP" ]; then
            cp "$ZIP" ./dist/ 2>/dev/null || true
            echo "Zip: $ZIP"
          fi

      - name: Rename artifacts
        if: ${{ !inputs['generate-gpo'] }}
        shell: bash
        run: |
          echo "=== Files in dist ==="
          ls ./dist/ 2>/dev/null || echo "dist empty"
          echo "=== Files in root ==="
          ls . 2>/dev/null
          set -x
          ls ./dist/ || true
          ls . || true

          ZIP=$(find . -name "*.win64.zip" \
            2>/dev/null | head -1)
          if [ -n "$ZIP" ]; then
            cp "$ZIP" ./astra.win-x86_64.zip
          fi

          if [[ "${{ matrix.arch }}" == "aarch64" ]]; then
            find . -name "*.installer*.exe" | head -1 | xargs -I{} mv {} ./astra.installer-arm64.exe || true
          else
            find . -name "*.installer*.exe" | head -1 | xargs -I{} mv {} ./astra.installer.exe || true
          fi

          if [ -f ./dist/output.mar ]; then
            mv ./dist/output.mar "windows${{ matrix.arch == 'aarch64' && '-arm64' || '' }}.mar"
          fi

          echo "=== Final files ==="
          ls . || true
          exit 0


      - name: Upload artifact (PGO)
        uses: actions/upload-artifact@v4
        if: ${{ inputs['generate-gpo'] && matrix.arch == 'x86_64' }}
        with:
          retention-days: 5
          name: ${{ matrix.arch == 'aarch64' && 'arm64' || matrix.arch }}-${{ inputs['profile-data-path-archive'] }}
          path: ./zen.win64-pgo-stage-1.zip
          if-no-files-found: warn

      - name: Remove unnecessary files from obj
        continue-on-error: true
        if: ${{ !inputs['generate-gpo'] }}
        shell: bash
        run: |
          set -x
          mkdir -p "obj-${{ matrix.arch }}-pc-windows-msvc"

          rm -rf "engine/obj-${{ matrix.arch }}-pc-windows-msvc/_tests" 2>/dev/null || true
          rm -f "engine/obj-${{ matrix.arch }}-pc-windows-msvc/config/autoconf.mk" 2>/dev/null || true
          rm -rf "engine/obj-${{ matrix.arch }}-pc-windows-msvc/config.statusd/substs/" 2>/dev/null || true
          rm -rf "engine/obj-${{ matrix.arch }}-pc-windows-msvc/dist/install" 2>/dev/null || true

          find "engine/obj-${{ matrix.arch }}-pc-windows-msvc/dist" -maxdepth 1 -type f -name "*.zip" -delete || true

          cp -r --no-dereference "engine/obj-${{ matrix.arch }}-pc-windows-msvc/"* "obj-${{ matrix.arch }}-pc-windows-msvc/" || true

      - name: Upload dist object
        if: ${{ !inputs['generate-gpo'] }}
        uses: actions/upload-artifact@v4
        with:
          retention-days: 2
          name: windows-x64-obj-${{ matrix.arch == 'aarch64' && 'arm64' || matrix.arch }}
          path: obj-${{ matrix.arch }}-pc-windows-msvc
          if-no-files-found: warn

      - name: Upload artifact (if Twilight branch, binary)
        if: ${{ !inputs['generate-gpo'] }}
        uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: astra.win-${{ matrix.arch == 'aarch64' && 'arm64' || matrix.arch }}.zip
          path: ./astra.win-${{ matrix.arch == 'aarch64' && 'arm64' || matrix.arch }}.zip
          if-no-files-found: warn

      - name: Upload artifact (if Twilight branch, installer)
        if: ${{ !inputs['generate-gpo'] }}
        uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: astra.installer${{ matrix.arch == 'aarch64' && '-arm64' ||  '' }}.exe
          path: ./astra.installer*.exe
          if-no-files-found: warn

      - name: Upload artifact (.mar)
        if: ${{ !inputs['generate-gpo'] }}
        uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: windows${{ matrix.arch == 'aarch64' && '-arm64' || '' }}.mar
          path: ./windows${{ matrix.arch == 'aarch64' && '-arm64' || '' }}.mar
          if-no-files-found: warn

      - name: Upload artifact (update manifests)
        if: ${{ !inputs['generate-gpo'] }}
        uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: windows_update_manifest_${{ matrix.arch == 'aarch64' && 'arm64' || matrix.arch }}
          path: ./dist/update
          if-no-files-found: warn
