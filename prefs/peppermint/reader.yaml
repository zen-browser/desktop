# Offer Reader Mode on every web page with text, not only on pages that look
# like articles, and let it open home pages and sites Firefox blocklists.
- name: peppermint.reader.always-available
  value: true

# Keep the pictures of an article saved for offline reading, so they show
# without a connection.
- name: peppermint.reader.offline.inline-images
  value: true

# Pictures larger than this many bytes are left out of a saved article.
- name: peppermint.reader.offline.max-image-bytes
  value: 2097152

# A saved article (text and pictures) is never larger than this many bytes.
- name: peppermint.reader.offline.max-article-bytes
  value: 12582912
