- name: zen.view.compact.hide-tabbar
  value: true

- name: zen.view.compact.hide-toolbar
  value: false

- name: zen.view.compact.toolbar-flash-popup
  value: false

- name: zen.view.compact.toolbar-flash-popup.duration
  value: 800

- name: zen.view.compact.toolbar-hide-after-hover.duration
  value: 1000

- name: zen.view.compact.sidebar-keep-hover.duration
  value: 150

# How far (in CSS pixels) the mouse may travel past the window bounds after
# leaving the window before the hovered sidebar/toolbar is collapsed
- name: zen.view.compact.outside-window-edge-offset.horizontal
  value: 200

- name: zen.view.compact.outside-window-edge-offset.vertical
  value: 100

- name: zen.view.compact.animate-sidebar
  value: true

- name: zen.view.compact.show-sidebar-and-toolbar-on-hover
  value: true

- name: zen.view.compact.show-background-tab-toast
  value: true

- name: zen.view.compact.debug
  value: false

# Do not edit manually
- name: zen.view.compact.enable-at-startup
  hidden: true
  value: false

# Spring-driven compact mode animations (compositor thread, interruptible).
- name: zen.view.compact.animation.use-springs
  value: true

# Slow-motion factor for inspecting/tuning the springs (1 = real time).
- name: zen.view.compact.animation.time-scale
  value: 1.0

- name: zen.view.compact.animation.spring.show.response
  value: 0.35

- name: zen.view.compact.animation.spring.show.damping-ratio
  value: 0.9

- name: zen.view.compact.animation.spring.hide.response
  value: 0.3

- name: zen.view.compact.animation.spring.hide.damping-ratio
  value: 1.0

- name: zen.view.compact.animation.spring.peek-in.response
  value: 0.3

- name: zen.view.compact.animation.spring.peek-in.damping-ratio
  value: 0.85

- name: zen.view.compact.animation.spring.peek-out.response
  value: 0.25

- name: zen.view.compact.animation.spring.peek-out.damping-ratio
  value: 1.0
