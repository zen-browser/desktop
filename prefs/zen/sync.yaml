  value: true

- name: services.sync.prefs.sync.zen.workspaces.switch-animation-duration
  value: true

- name: services.sync.prefs.sync.zen.workspaces.wrap-around-navigation
  value: true

- name: services.sync.prefs.sync.zen.workspaces.separate-essentials
  value: true

# Glance
- name: services.sync.prefs.sync.zen.glance.enable-contextmenu-search
  value: true

- name: services.sync.prefs.sync.zen.glance.open-essential-external-links
  value: true

# Browser view
- name: services.sync.prefs.sync.zen.view.use-single-toolbar
  value: true

- name: services.sync.prefs.sync.zen.view.show-newtab-button-top
