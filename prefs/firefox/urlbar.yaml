# URL bar and search-related preferences

# Astra: Trending off — extra network/RAM while typing
- name: browser.urlbar.trending.featureGate
  value: false

- name: browser.urlbar.weather.featureGate
  value: false

- name: browser.urlbar.quickactions.enabled
  value: false

- name: browser.urlbar.clipboard.featureGate
  value: true

- name: browser.urlbar.trimHttps
  value: true

- name: browser.urlbar.untrimOnUserInteraction.featureGate
  value: true

- name: media.videocontrols.picture-in-picture.urlbar-button.enabled
  value: true
  locked: true

- name: browser.search.suggest.enabled
  value: true

- name: browser.search.suggest.enabled.private
  value: true

- name: browser.urlbar.quicksuggest.enabled
  value: false
  locked: true

- name: browser.urlbar.suggest.quicksuggest.sponsored
  value: false
  locked: true

- name: browser.urlbar.suggest.quicksuggest.nonsponsored
  value: false
  locked: true

- name: browser.urlbar.groupLabels.enabled
  value: true

- name: browser.urlbar.keepPanelOpenDuringImeComposition
  value: true # IMPORTANT: Fixes closing the urlbar when on some languages

- name: browser.formfill.enable
  value: false

- name: browser.urlbar.suggest.topsites
  value: true
  locked: true

# Astra: Rich search suggestions — multiple keyword completions (SEO-style)
- name: browser.urlbar.showSearchSuggestionsFirst
  value: true

- name: browser.urlbar.maxRichResults
  value: 8

- name: browser.urlbar.maxHistoricalSearchSuggestions
  value: 6

- name: browser.urlbar.suggest.history
  value: true

- name: browser.urlbar.suggest.bookmark
  value: true

- name: browser.urlbar.suggest.openpage
  value: false

- name: browser.urlbar.suggest.searches
  value: true

- name: browser.urlbar.suggest.engines
  value: true

- name: browser.urlbar.suggest.trending
  value: false

- name: browser.urlbar.richSuggestions.tail
  value: true

- name: browser.urlbar.suggest.searchHistory
  value: true

# Astra: Off — saves RAM; HTTP/3 + disk cache handle load speed
- name: browser.urlbar.speculativeConnect.enabled
  value: false

# See https://github.com/zen-browser/desktop/issues/7248
# We've submitted a patch to Firefox at https://bugzilla.mozilla.org/show_bug.cgi?id=2018499
- name: browser.urlbar.closeOnWindowBlur
  value: false

- name: browser.urlbar.trustPanel.featureGate
  value: false
