<script type="text/javascript" src="chrome://browser/content/preferences/zen-settings.js"/>
<html:template id="template-paneZenLooks">

<hbox id="zenVerticalTabsCategory"
      class="subcategory"
      hidden="true"
      data-category="paneZenLooks">
<html:h1 data-l10n-id="zen-vertical-tabs-title"/>
</hbox>

<groupbox id="zenVerticalTabsGroup" data-category="paneZenLooks" hidden="true" class="highlighting-group">
  <label><html:h2 data-l10n-id="zen-vertical-tabs-layout-header"/></label>
    <description class="description-deemphasized" data-l10n-id="zen-vertical-tabs-layout-description" />
    <hbox id="zenLayoutList">
      <hbox layout="single">
        <html:img src="chrome://browser/content/zen-images/layouts/single-toolbar.png" />
        <label data-l10n-id="zen-layout-single-toolbar"></label>
      </hbox>
      <hbox layout="multiple">
        <html:img src="chrome://browser/content/zen-images/layouts/multiple-toolbar.png" />
        <label data-l10n-id="zen-layout-multiple-toolbar"></label>
      </hbox>
      <hbox layout="collapsed">
        <html:img src="chrome://browser/content/zen-images/layouts/collapsed.png" />
        <label data-l10n-id="zen-layout-collapsed-toolbar"></label>
      </hbox>
    </hbox>
  <label><html:h2 data-l10n-id="zen-vertical-tabs-header"/></label>
      <description class="description-deemphasized" data-l10n-id="zen-vertical-tabs-description" />

      <checkbox id="zenLooksAndFeelNewtabUnderLastTab"
            data-l10n-id="zen-vertical-tabs-newtab-on-tab-list"
            preference="zen.tabs.show-newtab-vertical"/>
    <vbox class="indent">
        <checkbox id="zenLooksAndFeelMoveNewtabToTop"
                data-l10n-id="zen-vertical-tabs-newtab-top-button-up"
                preference="zen.view.show-newtab-button-top"/>
    </vbox>
    <html:div data-l10n-id="preferences-web-appearance-footer">
        <html:a id="web-appearance-manage-themes-link" class="text-link" data-l10n-name="themes-link" href="about:addons" target="_blank" />
    </html:div>
</groupbox>

<hbox id="zenThemeCategory"
      class="subcategory"
      hidden="true"
      data-category="paneZenLooks">
<html:h1 data-l10n-id="pane-zen-theme-title"/>
</hbox>

<groupbox id="zenThemeGroup" data-category="paneZenLooks" hidden="true" class="highlighting-group">
      <label><html:h2 data-l10n-id="zen-look-and-feel-compact-view-header"/></label>
      <description class="description-deemphasized" data-l10n-id="zen-look-and-feel-compact-view-description" />

      <vbox class="indent">
            <checkbox id="zenLooksAndFeelEnableToolbarFlashPopup"
                      data-l10n-id="zen-look-and-feel-compact-toolbar-flash-popup"
                      preference="zen.view.compact.toolbar-flash-popup"/>
      </vbox>

      <label><html:h2 data-l10n-id="zen-low-bandwidth-mode-header"/></label>
      <description class="description-deemphasized" data-l10n-id="zen-low-bandwidth-mode-description" />
      <vbox class="indent">
            <checkbox id="zenLowBandwidthModeEnabled"
                      data-l10n-id="zen-low-bandwidth-mode-enabled"
                      preference="zen.performance.low-bandwidth-mode.enabled"/>
            <vbox class="indent">
                  <checkbox id="zenLowBandwidthModeBlockAutoplay"
                            data-l10n-id="zen-low-bandwidth-mode-block-autoplay"
                            preference="zen.performance.low-bandwidth-mode.block-autoplay"/>
                  <checkbox id="zenLowBandwidthModeBlockImages"
                            data-l10n-id="zen-low-bandwidth-mode-block-images"
                            preference="zen.performance.low-bandwidth-mode.block-images"/>
                  <checkbox id="zenLowBandwidthModeBlockFonts"
                            data-l10n-id="zen-low-bandwidth-mode-block-fonts"
                            preference="zen.performance.low-bandwidth-mode.block-fonts"/>
                  <checkbox id="zenLowBandwidthModeLazyLoading"
                            data-l10n-id="zen-low-bandwidth-mode-lazy-loading"
                            preference="zen.performance.low-bandwidth-mode.lazy-loading"/>
            </vbox>
      </vbox>

      <label><html:h2 data-l10n-id="zen-privacy-presets-header"/></label>
      <description class="description-deemphasized" data-l10n-id="zen-privacy-presets-description" />
      <vbox class="indent">
            <hbox align="center">
                  <label data-l10n-id="zen-privacy-presets-label"/>
                  <menulist id="zenPrivacyPreset" preference="zen.privacy.preset">
                        <menupopup>
                              <menuitem data-l10n-id="zen-privacy-presets-balanced" value="balanced"/>
                              <menuitem data-l10n-id="zen-privacy-presets-strict" value="strict"/>
                              <menuitem data-l10n-id="zen-privacy-presets-maximum" value="maximum"/>
                        </menupopup>
                  </menulist>
            </hbox>
      </vbox>

      <label><html:h2 data-l10n-id="zen-recommended-extensions-header"/></label>
      <description class="description-deemphasized" data-l10n-id="zen-recommended-extensions-description" />
      <vbox id="zenRecommendedExtensionsList" class="indent">
            <vbox class="zenRecommendedExtensionCard" id="zenRecommendedExtension-ublock-origin">
                  <label><html:h3 data-l10n-id="zen-recommended-extension-ublock-title"/></label>
                  <description class="description-deemphasized" data-l10n-id="zen-recommended-extension-ublock-description" />
                  <description class="description-deemphasized" id="zenRecommendedExtensionState-ublock-origin" data-l10n-id="zen-recommended-extension-state-not-installed" />
                  <hbox>
                        <button class="zenRecommendedExtensionInstallButton" data-extension-key="ublock-origin" data-l10n-id="zen-recommended-extension-install-button" />
                        <button class="zenRecommendedExtensionToggleButton" data-extension-key="ublock-origin" data-l10n-id="zen-recommended-extension-enable-button" />
                  </hbox>
            </vbox>
            <vbox class="zenRecommendedExtensionCard" id="zenRecommendedExtension-bitwarden">
                  <label><html:h3 data-l10n-id="zen-recommended-extension-bitwarden-title"/></label>
                  <description class="description-deemphasized" data-l10n-id="zen-recommended-extension-bitwarden-description" />
                  <description class="description-deemphasized" id="zenRecommendedExtensionState-bitwarden" data-l10n-id="zen-recommended-extension-state-not-installed" />
                  <hbox>
                        <button class="zenRecommendedExtensionInstallButton" data-extension-key="bitwarden" data-l10n-id="zen-recommended-extension-install-button" />
                        <button class="zenRecommendedExtensionToggleButton" data-extension-key="bitwarden" data-l10n-id="zen-recommended-extension-enable-button" />
                  </hbox>
            </vbox>
            <vbox class="zenRecommendedExtensionCard" id="zenRecommendedExtension-dark-reader">
                  <label><html:h3 data-l10n-id="zen-recommended-extension-dark-reader-title"/></label>
                  <description class="description-deemphasized" data-l10n-id="zen-recommended-extension-dark-reader-description" />
                  <description class="description-deemphasized" id="zenRecommendedExtensionState-dark-reader" data-l10n-id="zen-recommended-extension-state-not-installed" />
                  <hbox>
                        <button class="zenRecommendedExtensionInstallButton" data-extension-key="dark-reader" data-l10n-id="zen-recommended-extension-install-button" />
                        <button class="zenRecommendedExtensionToggleButton" data-extension-key="dark-reader" data-l10n-id="zen-recommended-extension-enable-button" />
                  </hbox>
            </vbox>
            <vbox class="zenRecommendedExtensionCard" id="zenRecommendedExtension-proton-vpn">
                  <label><html:h3 data-l10n-id="zen-recommended-extension-proton-vpn-title"/></label>
                  <description class="description-deemphasized" data-l10n-id="zen-recommended-extension-proton-vpn-description" />
                  <description class="description-deemphasized" id="zenRecommendedExtensionState-proton-vpn" data-l10n-id="zen-recommended-extension-state-not-installed" />
                  <hbox>
                        <button class="zenRecommendedExtensionInstallButton" data-extension-key="proton-vpn" data-l10n-id="zen-recommended-extension-install-button" />
                        <button class="zenRecommendedExtensionToggleButton" data-extension-key="proton-vpn" data-l10n-id="zen-recommended-extension-enable-button" />
                  </hbox>
            </vbox>
            <vbox class="zenRecommendedExtensionCard" id="zenRecommendedExtension-privacy-badger">
                  <label><html:h3 data-l10n-id="zen-recommended-extension-privacy-badger-title"/></label>
                  <description class="description-deemphasized" data-l10n-id="zen-recommended-extension-privacy-badger-description" />
                  <description class="description-deemphasized" id="zenRecommendedExtensionState-privacy-badger" data-l10n-id="zen-recommended-extension-state-not-installed" />
                  <hbox>
                        <button class="zenRecommendedExtensionInstallButton" data-extension-key="privacy-badger" data-l10n-id="zen-recommended-extension-install-button" />
                        <button class="zenRecommendedExtensionToggleButton" data-extension-key="privacy-badger" data-l10n-id="zen-recommended-extension-enable-button" />
                  </hbox>
            </vbox>

      <label><html:h2 data-l10n-id="zen-look-and-feel-window-drag-header"/></label>
      <description class="description-deemphasized" data-l10n-id="zen-look-and-feel-window-drag-description" />

      <vbox class="indent">
            <checkbox id="zenLooksAndFeelWindowDragEnabled"
                  data-l10n-id="zen-window-drag-enabled"
                  preference="zen.view.drag-window-from-content"/>
      </vbox>
</groupbox>

<hbox id="zenGlanceCategory"
      class="subcategory"
      hidden="true"
      data-category="paneZenLooks">
<html:h1 data-l10n-id="zen-glance-title"/>
</hbox>

<groupbox id="zenGlanceGroup" data-category="paneZenLooks" hidden="true" class="highlighting-group">
      <label><html:h2 data-l10n-id="zen-glance-header"/></label>
      <description class="description-deemphasized" data-l10n-id="zen-glance-description" />

      <checkbox id="zenLooksAndFeelGlanceEnabled"
            data-l10n-id="zen-glance-enabled"
            preference="zen.glance.enabled"/>
      <hbox align="center">
            <label id="zenGlanceTriggerLabel" data-l10n-id="zen-glance-trigger-label"/>
            <menulist id="zenGlanceTrigger" preference="zen.glance.activation-method">
                  <menupopup>
                        <menuitem data-l10n-id="zen-glance-trigger-ctrl-click" value="ctrl"/>
                        <menuitem data-l10n-id="zen-glance-trigger-alt-click" value="alt"/>
                        <menuitem data-l10n-id="zen-glance-trigger-shift-click" value="shift"/>
#ifdef XP_MACOSX
                        <menuitem data-l10n-id="zen-glance-trigger-meta-click" value="meta"/>
#endif
                  </menupopup>
            </menulist>
        </hbox>
</groupbox>

<hbox id="zenUrlBarCategory"
      class="subcategory"
      hidden="true"
      data-category="paneZenLooks">
<html:h1 data-l10n-id="zen-urlbar-title"/>
</hbox>

<groupbox id="zenUrlbarGroup" data-category="paneZenLooks" hidden="true" class="highlighting-group">
      <label><html:h2 data-l10n-id="zen-urlbar-header"/></label>
      <description class="description-deemphasized" data-l10n-id="zen-urlbar-description" />

      <hbox align="center">
            <label data-l10n-id="zen-urlbar-behavior-label"/>
            <menulist preference="zen.urlbar.behavior">
                  <menupopup>
                        <menuitem data-l10n-id="zen-urlbar-behavior-normal" value="normal"/>
                        <menuitem data-l10n-id="zen-urlbar-behavior-floating-on-type" value="floating-on-type"/>
                        <menuitem data-l10n-id="zen-urlbar-behavior-float" value="float"/>
                  </menupopup>
            </menulist>
        </hbox>
</groupbox>

</html:template>
