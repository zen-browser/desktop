# Mica effect preferences for Windows
- name: widget.windows.mica
  value: true
  condition: "defined(XP_WIN)"

- name: zen.widget.windows.acrylic
  value: false
  condition: "defined(XP_WIN)"

- name: widget.windows.mica.popups
  value: true
  condition: "defined(XP_WIN)"

# 1 = DWMSBT_MAINWINDOW
# 2 = DWMSBT_TRANSIENTWINDOW (Acrylic; Zen 1.19.7b default, also used for popups)
# 3 = DWMSBT_TABBEDWINDOW (MicaAlt)
# Keep 2 so Zen chrome CSS does not apply the non-Acrylic frosted tint path.
- name: widget.windows.mica.toplevel-backdrop
  value: 2
  condition: "defined(XP_WIN)"

- name: widget.transparent-windows
  value: true
  condition: "defined(XP_WIN)"
