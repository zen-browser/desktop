name: Linux Release Build

on:
  workflow_call:
    inputs:
      build-version:
        description: "The version to build"
        required: true
        type: string
      release-branch:
        description: "The branch to build"
        required: true
        type: string
      MOZ_BUILD_DATE:
        type: string
        required: true
        default: ""
      use-sccache:
        description: "Use sccache"
        required: true
        type: boolean
        default: false

jobs:
  build-linux:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      SCCACHE_GHA_ENABLED: ${{ inputs['use-sccache'] && 'true' || 'false' }}
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: ${{ inputs['use-sccache'] && 'sccache' || '' }}
      CARGO_INCREMENTAL: 0
    name: Build Linux - ${{ matrix.arch }}

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main
        continue-on-error: true
        if: ${{ inputs['use-sccache'] }}
        with:
          disable_annotations: true

      - name: Expose actions cache variables
        uses: actions/github-script@v6
        continue-on-error: true
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'])
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'])

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install system dependencies
        run: |
          set -x
          sudo apt-get update --fix-missing
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip dos2unix yasm nasm build-essential libgtk2.0-dev libpython3-dev m4 uuid libasound2-dev libcurl4-openssl-dev libdbus-1-dev libdrm-dev libdbus-glib-1-dev libgtk-3-dev libpulse-dev libx11-xcb-dev libxt-dev xvfb lld llvm

      - name: Install dependencies
        run: |
          npm ci

      - name: Load Surfer CI setup
        run: npm run surfer -- ci --brand ${{ inputs['release-branch'] }} --display-version ${{ inputs['build-version'] }}

      - name: Download Firefox source and dependencies
        run: npm run download

      - name: Fix Rust version
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain $(cat .rust-toolchain)
          source $HOME/.cargo/env

          if test "${{ matrix.arch }}" = "aarch64"; then
            rustup target add aarch64-unknown-linux-gnu
          else
            rustup target add x86_64-unknown-linux-gnu
          fi

      - name: Import
        env:
          SURFER_COMPAT: ${{ matrix.arch }}
        run: |
          . "$HOME/.cargo/env"
          npm run import

      - name: Validate jar manifest paths
        run: python scripts/validate_jar_manifest.py

      - name: Build language packs
        continue-on-error: true
        run: sh scripts/download-language-packs.sh

      - name: Bootstrap
        run: |
          cd engine
          export SURFER_PLATFORM="linux"
          ./mach --no-interactive bootstrap --application-choice browser
          cd ..

      - name: Insert API Keys
        run: |
          mkdir -p ~/.zen-keys
          echo "placeholder" > ~/.zen-keys/safebrowsing.dat

      - name: Build
        env:
          SURFER_COMPAT: ${{ matrix.arch }}
          ZEN_RELEASE_BRANCH: ${{ inputs['release-branch'] }}
        run: |
          export SURFER_PLATFORM="linux"
          if [[ -n "${{ inputs.MOZ_BUILD_DATE }}" ]]; then
            export MOZ_BUILD_DATE=${{ inputs.MOZ_BUILD_DATE }}
          fi
          bash .github/workflows/src/release-build.sh

      - name: Package
        env:
          SURFER_COMPAT: ${{ matrix.arch }}
          ZEN_GA_DISABLE_PGO: true
          # Match Windows MAR channel IDs so updater accepts cross-platform packs.
          MAR_CHANNEL_ID: firefox-mozilla-central
          ACCEPTED_MAR_CHANNEL_IDS: firefox-mozilla-central
        run: |
          set -euo pipefail
          export SURFER_PLATFORM="linux"
          export ZEN_RELEASE=1
          export MAR_CHANNEL_ID="${MAR_CHANNEL_ID}"
          export ACCEPTED_MAR_CHANNEL_IDS="${ACCEPTED_MAR_CHANNEL_IDS}"
          # Force Surfer MAR channel IDs to match Windows builds (firefox-mozilla-central).
          node -e "
            const fs = require('fs');
            const p = 'node_modules/@zen-browser/surfer/dist/commands/package.js';
            let t = fs.readFileSync(p, 'utf8');
            const next = t.replace(
              /MAR_CHANNEL_ID:\s*channel,/,
              'MAR_CHANNEL_ID: process.env.MAR_CHANNEL_ID || channel,'
            );
            if (next === t) {
              console.warn('Surfer package.js MAR_CHANNEL_ID override not applied (pattern miss)');
            } else {
              fs.writeFileSync(p, next);
              console.log('Surfer package.js uses MAR_CHANNEL_ID from env when set');
            }
          "
          # Same ARG_MAX-safe MAR path used on Windows (file-list + Python writer).
          ROOT_UNIX="$(pwd)"
          if [[ -f engine/tools/update-packaging/make_full_update.sh ]]; then
            python3 scripts/patch_make_full_update_arg_max.py \
              engine/tools/update-packaging/make_full_update.sh \
              "${ROOT_UNIX}"
          fi
          npm run package
          test -s dist/output.mar
          test -d dist/update
          # Fail closed on stub/corrupt MARs (manifest-only packs are ~600-900 bytes).
          MAR_BYTES="$(wc -c < dist/output.mar | tr -d ' ')"
          MIN_MAR_BYTES=10485760 # 10 MiB; real Linux packs are tens of MiB
          if [ "${MAR_BYTES}" -lt "${MIN_MAR_BYTES}" ]; then
            echo "::error::dist/output.mar is only ${MAR_BYTES} bytes (min ${MIN_MAR_BYTES})"
            ls -la dist/output.mar || true
            exit 1
          fi
          echo "Linux package OK: $(du -h dist/output.mar | awk '{print $1}') (${MAR_BYTES} bytes) MAR"

      - name: Remove API Keys
        continue-on-error: true
        run: |
          rm -rf ~/.zen-keys

      - name: Inject uBlock into Linux build
        continue-on-error: true
        run: |
          set -x
          LINUX_TAR=$(find dist -maxdepth 1 -type f -name "*.tar.xz" 2>/dev/null | head -1)
          if [ -n "$LINUX_TAR" ]; then
            mkdir -p dist/astra/distribution/extensions
            curl -fsSL "https://github.com/gorhill/uBlock/releases/download/1.62.0/uBlock0_1.62.0.firefox.signed.xpi" \
              -o dist/astra/distribution/extensions/uBlock0@raymondhill.net.xpi
            cp build/AppDir/distribution/policies.json dist/astra/distribution/policies.json
            test -s dist/astra/distribution/policies.json
            echo "uBlock injected into Linux build"
          fi

      - name: Rename artifacts
        run: |
          set -euo pipefail
          LINUX_TAR=$(find dist -maxdepth 1 -type f -name "*.tar.xz" 2>/dev/null | head -1)
          if [ -z "$LINUX_TAR" ]; then
            echo "::error::No Linux archive (*.tar.xz) found in dist/"
            ls -la dist || true
            exit 1
          fi
          mv "$LINUX_TAR" "astra.linux-${{ matrix.arch }}.tar.xz"
          test -s dist/output.mar
          MAR_BYTES="$(wc -c < dist/output.mar | tr -d ' ')"
          if [ "${MAR_BYTES}" -lt 10485760 ]; then
            echo "::error::Refusing to publish stub MAR (${MAR_BYTES} bytes)"
            exit 1
          fi
          mv dist/output.mar "linux${{ matrix.arch == 'aarch64' && '-aarch64' || '' }}.mar"
          test -s "linux${{ matrix.arch == 'aarch64' && '-aarch64' || '' }}.mar"
          # Align Surfer twilight download tag with GitHub release tag twilight-1.
          if [[ "${{ inputs['release-branch'] }}" == "twilight" ]]; then
            python3 scripts/fix_linux_update_xml_twilight_tag.py dist/update
          fi
          if [ -f "dist/zen-${{ matrix.arch }}.AppImage" ]; then
            mv "dist/zen-${{ matrix.arch }}.AppImage" "dist/astra-${{ matrix.arch }}.AppImage"
          fi
          if [ -f "dist/zen-${{ matrix.arch }}.AppImage.zsync" ]; then
            mv "dist/zen-${{ matrix.arch }}.AppImage.zsync" "dist/astra-${{ matrix.arch }}.AppImage.zsync"
          fi

      - name: Upload build artifact (binary)
        uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: astra.linux-${{ matrix.arch }}.tar.xz
          path: ./astra.linux-${{ matrix.arch }}.tar.xz
          if-no-files-found: error

      - name: Upload build artifact (.mar)
        uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: linux${{ matrix.arch == 'aarch64' && '-aarch64' || '' }}.mar
          path: ./linux${{ matrix.arch == 'aarch64' && '-aarch64' || '' }}.mar
          if-no-files-found: error

      - name: Upload build artifact (update manifests)
        uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: linux_update_manifest_${{ matrix.arch }}
          path: ./dist/update
          if-no-files-found: error
