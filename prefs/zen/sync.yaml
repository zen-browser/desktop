- name: services.sync.engine.spaces
  value: "@cond"
  condition: "@IS_TWILIGHT@"

- name: zen.spaces-sync.debug
  value: false

- name: zen.spaces-sync.normal-tabs
  value: false

- name: services.sync.prefs.sync.zen.spaces-sync.normal-tabs
  value: true

# Tabs
- name: services.sync.prefs.sync.zen.tabs.show-newtab-vertical
  value: true

- name: services.sync.prefs.sync.zen.tabs.select-recently-used-on-close
  value: true


- name: services.sync.prefs.sync.zen.tabs.open-pinned-in-new-tab
  value: true

- name: services.sync.prefs.sync.zen.tabs.close-on-back-with-no-history
  value: true

- name: services.sync.prefs.sync.zen.tabs.ctrl-tab.ignore-essential-tabs
  value: true

- name: services.sync.prefs.sync.zen.tabs.ctrl-tab.ignore-pending-tabs
  value: true

- name: services.sync.prefs.sync.zen.ctrlTab.show-pending-tabs
  value: true

- name: services.sync.prefs.sync.zen.startup.smooth-scroll-in-tabs
  value: true

# URL bar

- name: services.sync.prefs.sync.zen.urlbar.show-protections-icon
  value: true

- name: services.sync.prefs.sync.zen.urlbar.show-contextual-id
  value: true

- name: services.sync.prefs.sync.zen.urlbar.behavior
  value: true

- name: services.sync.prefs.sync.zen.urlbar.hide-one-offs
  value: true

- name: services.sync.prefs.sync.zen.urlbar.enable-overrides
  value: true

- name: services.sync.prefs.sync.zen.urlbar.single-toolbar-show-copy-url
