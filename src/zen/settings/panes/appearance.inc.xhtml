        <html:section id="zen-settings-pane-appearance" class="zen-settings-pane" role="tabpanel" data-pane="appearance" hidden="hidden">
          <html:div class="zen-settings-group">
            <html:h2 data-l10n-id="zen-settings-window-layout-header"/>
            <html:div class="zen-settings-card">
              <html:div class="zen-settings-row zen-settings-layout-row">
                <html:span id="zen-settings-layout-label" class="zen-settings-row-text" data-l10n-id="zen-settings-window-layout"/>
                <html:div id="zen-settings-layout" role="radiogroup" aria-labelledby="zen-settings-layout-label">
                  <html:button class="zen-settings-layout-option" role="radio" data-layout="single">
                    <html:img src="chrome://browser/content/zen-images/layouts/single-toolbar.png" alt=""/>
                    <html:span data-l10n-id="zen-settings-window-layout-single"/>
                  </html:button>
                  <html:button class="zen-settings-layout-option" role="radio" data-layout="multiple">
                    <html:img src="chrome://browser/content/zen-images/layouts/multiple-toolbar.png" alt=""/>
                    <html:span data-l10n-id="zen-settings-window-layout-multiple"/>
                  </html:button>
                  <html:button class="zen-settings-layout-option" role="radio" data-layout="collapsed">
                    <html:img src="chrome://browser/content/zen-images/layouts/collapsed.png" alt=""/>
                    <html:span data-l10n-id="zen-settings-window-layout-collapsed"/>
                  </html:button>
                </html:div>
              </html:div>
              <html:div class="zen-settings-row zen-settings-toggle-row">
                <html:span class="zen-settings-row-text" data-l10n-id="zen-settings-window-tabs-right"/>
                <html:moz-toggle class="zen-settings-toggle" data-pref="zen.tabs.vertical.right-side"/>
              </html:div>
              <html:div class="zen-settings-row zen-settings-toggle-row">
                <html:span class="zen-settings-row-text" data-l10n-id="zen-settings-window-newtab-button"/>
                <html:moz-toggle class="zen-settings-toggle" data-pref="zen.tabs.show-newtab-vertical"/>
              </html:div>
              <html:div class="zen-settings-row zen-settings-toggle-row" data-depends-on="zen.tabs.show-newtab-vertical">
                <html:span class="zen-settings-row-text" data-l10n-id="zen-settings-window-newtab-button-top"/>
                <html:moz-toggle class="zen-settings-toggle" data-pref="zen.view.show-newtab-button-top"/>
              </html:div>
            </html:div>
          </html:div>
#ifdef XP_WIN
          <html:div class="zen-settings-group">
            <html:h2 data-l10n-id="zen-settings-window-backdrop-header"/>
            <html:div class="zen-settings-card">
              <html:div class="zen-settings-row">
                <html:div class="zen-settings-row-text">
                  <html:span id="zen-settings-backdrop-label" data-l10n-id="zen-settings-window-backdrop"/>
                  <html:span class="zen-settings-row-description" data-l10n-id="zen-settings-window-backdrop-description"/>
                </html:div>
                <menulist id="zen-settings-backdrop" aria-labelledby="zen-settings-backdrop-label">
                  <menupopup>
                    <menuitem value="1" data-l10n-id="zen-settings-window-backdrop-mica"/>
                    <menuitem value="3" data-l10n-id="zen-settings-window-backdrop-mica-alt"/>
                    <menuitem value="2" data-l10n-id="zen-settings-window-backdrop-acrylic"/>
                  </menupopup>
                </menulist>
              </html:div>
            </html:div>
          </html:div>
#endif
        </html:section>
