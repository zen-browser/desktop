- name: browser.lowMemoryResponseMask
  value: 3
  condition: "defined(XP_MACOSX)"

- name: network.predictor.enable-hover-on-ssl
  value: false

# See https://github.com/zen-browser/desktop/issues/11599, this pref seems to
# have disabled itself on macos for some unknown reason.
# Make sure its in sync with:
# https://searchfox.org/firefox-main/rev/1477feb9706f4ccc5bd571c1c215832a6fbb7464/modules/libpref/init/StaticPrefList.yaml#7741-7748
- name: gfx.webrender.compositor
  condition: "defined(XP_WIN) || defined(XP_DARWIN)"
  value: "@cond"
  mirror: once

# Astra: Hardware acceleration
- name: gfx.canvas.accelerated
  value: true
- name: layers.gpu-process.enabled
  value: true
- name: media.hardware-video-decoding.enabled
  value: true

# Astra: JavaScript JIT engine optimization
- name: javascript.options.ion
  value: true
- name: javascript.options.baselinejit
  value: true
- name: javascript.options.asmjs
  value: true

# Astra: Memory cache optimization
- name: browser.cache.memory.enable
  value: true
- name: browser.cache.memory.capacity
  value: -1

# Astra: Faster page rendering
- name: content.notify.interval
  value: 100000
- name: image.mem.decode_bytes_at_a_time
  value: 65536

# Astra: Session save less frequently (faster UI)
- name: browser.sessionstore.interval
  value: 15000

# Astra: DNS over HTTPS - faster + secure connectivity
- name: network.trr.mode
  value: 2
- name: network.trr.uri
  value: "https://mozilla.cloudflare-dns.com/dns-query"
- name: network.trr.bootstrapAddr
  value: "1.1.1.1"

# Astra: Better connection handling (fail faster on poor mobile/Wi‑Fi)
- name: network.http.connection-retry-timeout
  value: 0
- name: network.http.connection-timeout
  value: 45
- name: network.http.response.timeout
  value: 120
- name: network.http.fast-fallback-to-IPv4
  value: true
- name: network.http.max-persistent-connections-per-server
  value: 8

# Astra: Smoother scrolling / compositing
- name: general.smoothScroll
  value: true
- name: general.smoothScroll.pages
  value: true
- name: layout.frame_rate.precise
  value: true

# Astra: TCP Fast Open - faster connections
- name: network.tcp.tcp_fastopen_enable
  value: true
