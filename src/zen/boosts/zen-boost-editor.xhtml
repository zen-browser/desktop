<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>

<?xml-stylesheet href="chrome://browser/content/zen-styles/zen-boosts.css" type="text/css"?>
<?xml-stylesheet href="chrome://browser/content/zen-styles/zen-buttons.css" type="text/css"?>
<?xml-stylesheet href="chrome://browser/content/zen-styles/zen-theme.css" type="text/css"?>
<?xml-stylesheet href="chrome://browser/content/zen-styles/zen-animations.css" type="text/css"?>
<?xml-stylesheet href="chrome://browser/skin/zen-icons/icons.css" type="text/css"?>

<!DOCTYPE window>

<window
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  id="zenSettingsWindow"
  alwaysontop="true"
  style="min-width: 135px; height: 28em">

  <!-- Loading in the window module -->
  <html:script>
    const { nsZenBoostEditor } = ChromeUtils.importESModule( "resource:///modules/ZenBoostsEditor.sys.mjs" );
      window.addEventListener("load", () => {           
      new nsZenBoostEditor(document, window.domain, window);
    });
  </html:script>

  <vbox flex="1" id="zen-boost-editor-root">
    <vbox flex="1" id="zen-boost-filter-wrapper">
      <hbox flex="1" id="zen-boost-head-wrapper">
        <html:input
          data-l10n="zen-boost-name"
          type="text"
          value="New Boost"
          minlength="1"
          maxlength="12"
          id="zen-boost-name" />
        <button
          data-l10n="zen-boost-delete"
          id="zen-boost-delete"
          class="subviewbutton"></button>
      </hbox>

      <hbox class="zen-boost-color-picker-gradient">
        <div class="zen-boost-color-picker-dot"></div>
        <div class="zen-boost-color-picker-circle"></div>
      </hbox>

      <!-- <html:input type="range" max="1" value="1" step="0.05" id="zen-boost-contrast" min="0.5"/>
        <html:input type="range" max="360" value="0" step="5" id="zen-boost-hue-shift" min="0"/>
        <html:input type="range" max="1" value="1" step="0.1" id="zen-boost-saturation" min="0"/> -->

      <hbox flex="1" id="zen-boost-toolbar-wrapper">
        <button
          data-l10n="zen-boost-invert"
          id="zen-boost-invert"
          class="subviewbutton"></button>
        <button
          data-l10n="zen-boost-zap"
          id="zen-boost-zap"
          class="subviewbutton"></button>
        <button
          data-l10n="zen-boost-disable"
          id="zen-boost-disable"
          class="subviewbutton"></button>
      </hbox>

      <separator />
      
      <div id="zen-boost-font-wrapper">
        <vbox id="zen-boost-font-grid">
          <button data-l10n="zen-boost-font-arial" id="zen-boost-font-arial" class="subviewbutton">Aa</button>
          <button data-l10n="zen-boost-font-serif" id="zen-boost-font-serif" class="subviewbutton">Aa</button>
          <button data-l10n="zen-boost-font-mono" id="zen-boost-font-mono" class="subviewbutton">Aa</button>
          <button data-l10n="zen-boost-font-georgia" id="zen-boost-font-georgia" class="subviewbutton">Aa</button>
          <button data-l10n="zen-boost-font-comic" id="zen-boost-font-comic" class="subviewbutton">Aa</button>
          <button data-l10n="zen-boost-font-tahoma" id="zen-boost-font-tahoma" class="subviewbutton">Aa</button>
          <button data-l10n="zen-boost-font-verdana" id="zen-boost-font-verdana" class="subviewbutton">Aa</button>
          <button data-l10n="zen-boost-font-corsiva" id="zen-boost-font-corsiva" class="subviewbutton">Aa</button>
        </vbox>
      </div>
    </vbox>
  </vbox>
</window>
