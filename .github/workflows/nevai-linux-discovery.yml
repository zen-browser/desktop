name: Nevai Linux Discovery

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEVAI_LINUX_BUILD_LOG: /tmp/nevai-linux-build.log
  NEVAI_LINUX_LOG_DIR: /tmp/nevai-linux-discovery-logs

on:
  workflow_dispatch:
  push:
    branches:
      - nevai/stage2-linux-discovery

concurrency:
  group: nevai-linux-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-discovery:
    name: Linux build discovery
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show runner resources
        run: |
          set -euxo pipefail

          echo "== System =="
          uname -a

          echo
          echo "== Disk =="
          df -h

          echo
          echo "== Memory =="
          free -h

          echo
          echo "== CPU =="
          nproc

          echo
          echo "== Workspace =="
          pwd
          ls -la

      - name: Install basic system packages
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            git \
            python3 \
            python3-pip \
            python3-venv \
            unzip \
            zip \
            tar \
            xz-utils \
            ripgrep \
            ccache \
            libgtk-3-dev \
            libdbus-glib-1-dev \
            libxt-dev \
            libx11-xcb-dev \
            libasound2-dev \
            libpulse-dev \
            yasm \
            nasm \
            xvfb

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Source smoke check
        run: |
          set -euxo pipefail
          ./scripts/check-nevai-stage2-source.sh

      - name: Install npm dependencies
        run: |
          set -euxo pipefail
          npm ci

      - name: Download Firefox source
        run: |
          set -euxo pipefail
          npm run download

      - name: Bootstrap
        run: |
          set -euxo pipefail
          npm run bootstrap

      - name: Generate Firefox prefs
        run: |
          set -euxo pipefail
          npm run ffprefs

      - name: Update service dumps
        run: |
          set -euxo pipefail
          python3 scripts/update_service_dumps.py

      - name: Inspect tree before surfer import
        if: ${{ always() }}
        run: |
          set -euxo pipefail

          echo "== Root files =="
          ls -la

          echo
          echo "== Engine top-level =="
          ls -la engine || true

          echo
          echo "== Source patch dirs =="
          find src -maxdepth 3 -type f | head -n 120 || true

          echo
          echo "== Generated service dump candidates =="
          find engine -maxdepth 5 -type f \( -name '*dump*' -o -name '*services*' \) | head -n 120 || true

          echo
          echo "== Disk =="
          df -h

      - name: Surfer import
        run: |
          set -euxo pipefail
          npm run surfer -- import

      - name: Install cbindgen
        run: |
          set -euxo pipefail

          cargo install --force cbindgen

          which cbindgen
          cbindgen --version

      - name: Create Linux discovery mozconfig
        run: |
          set -euxo pipefail

          MOZCONFIG_FILE="$PWD/engine/mozconfig-nevai-linux-discovery"

          cat > "$MOZCONFIG_FILE" <<EOF
          # Nevai Linux discovery mozconfig.
          # This is CI discovery-only, not final release hardening.

          ac_add_options --with-app-name=nevai
          ac_add_options --with-app-basename=Nevai
          ac_add_options --with-l10n-base=\${topsrcdir}/browser/locales
          ac_add_options --with-distribution-id=app.nevai.browser
          ac_add_options --enable-application=browser
          ac_add_options --disable-updater
          ac_add_options --enable-jxl
          ac_add_options --with-unsigned-addon-scopes=app,system
          ac_add_options --disable-debug
          ac_add_options --with-branding=browser/branding/unofficial
          ac_add_options --enable-update-channel=unofficial

          # Discovery-only bypass for GitHub hosted Ubuntu missing WASI sysroot.
          # The configure error itself recommends this flag.
          ac_add_options --without-wasm-sandboxed-libraries

          export MOZ_APP_BASENAME=Nevai
          export MOZ_APP_VENDOR=Nevai
          export MOZ_BRANDING_DIRECTORY=browser/branding/unofficial
          export MOZ_OFFICIAL_BRANDING_DIRECTORY=browser/branding/unofficial
          export MOZ_SOURCE_REPO=https://github.com/zen-browser/desktop
          export MOZ_SOURCE_CHANGESET=${GITHUB_SHA}
          export MOZ_INCLUDE_SOURCE_INFO=1
          export MOZ_APPUPDATE_HOST=updates.invalid
          export ZEN_FIREFOX_VERSION=150.0.2

          export MOZ_DATA_REPORTING=
          export MOZ_SERVICES_HEALTHREPORT=
          export MOZ_TELEMETRY_REPORTING=
          export MOZ_REQUIRE_SIGNING=
          EOF

          echo "== Linux discovery mozconfig =="
          cat "$MOZCONFIG_FILE"

      - name: Inspect tree before Linux build
        if: ${{ always() }}
        run: |
          set -euxo pipefail

          echo "== Root files =="
          ls -la

          echo
          echo "== Engine obj dirs before build =="
          find engine -maxdepth 2 -type d -name 'obj-*' -print || true

          echo
          echo "== Tool versions =="
          rustc --version
          cargo --version
          cbindgen --version
          clang --version || true
          clang++ --version || true
          python3 --version
          node --version
          npm --version

          echo
          echo "== Disk before build =="
          df -h

      - name: Build Linux with direct mozconfig and full log capture
        run: |
          set -uxo pipefail

          mkdir -p "$NEVAI_LINUX_LOG_DIR"
          rm -f "$NEVAI_LINUX_BUILD_LOG"

          MOZCONFIG_FILE="$PWD/engine/mozconfig-nevai-linux-discovery"

          echo "== Starting direct Linux discovery build =="
          echo "Using MOZCONFIG:"
          echo "$MOZCONFIG_FILE"
          echo
          echo "Full build log will be written to:"
          echo "$NEVAI_LINUX_BUILD_LOG"

          cd engine
          MOZCONFIG="$MOZCONFIG_FILE" ./mach build 2>&1 | tee "$NEVAI_LINUX_BUILD_LOG"
          status=${PIPESTATUS[0]}

          echo
          echo "== Build exit code: $status =="
          exit "$status"

      - name: Print final build log tail
        if: ${{ always() }}
        run: |
          set -euxo pipefail

          echo "== Build log path =="
          echo "$NEVAI_LINUX_BUILD_LOG"

          if [ -f "$NEVAI_LINUX_BUILD_LOG" ]; then
            echo
            echo "== Last 250 lines of build log =="
            tail -n 250 "$NEVAI_LINUX_BUILD_LOG"
          else
            echo "No build log found at $NEVAI_LINUX_BUILD_LOG"
          fi

      - name: Collect Linux discovery logs
        if: ${{ always() }}
        run: |
          set -euxo pipefail

          mkdir -p "$NEVAI_LINUX_LOG_DIR"

          if [ -f "$NEVAI_LINUX_BUILD_LOG" ]; then
            cp "$NEVAI_LINUX_BUILD_LOG" "$NEVAI_LINUX_LOG_DIR/nevai-linux-build.log"
          fi

          echo "== Collecting mozbuild logs =="
          find "$HOME/.mozbuild" -type f \( \
            -name '*.log' -o \
            -name '*.txt' -o \
            -name '*.json' \
          \) -print -exec cp --parents {} "$NEVAI_LINUX_LOG_DIR" \; 2>/dev/null || true

          echo "== Collecting engine obj logs =="
          find engine -type f \( \
            -name 'config.log' -o \
            -name 'configure.log' -o \
            -name '*.log' -o \
            -name 'warnings_*.json' \
          \) -print -exec cp --parents {} "$NEVAI_LINUX_LOG_DIR" \; 2>/dev/null || true

          echo "== Build output candidates =="
          {
            echo "== Engine obj dirs =="
            find engine -maxdepth 2 -type d -name 'obj-*' -print || true

            echo
            echo "== Possible dist/bin =="
            find engine -path '*/dist/bin' -type d -print || true

            echo
            echo "== Possible app files =="
            find engine \
              -path '*/dist/bin/application.ini' -o \
              -path '*/dist/bin/nevai' -o \
              -path '*/dist/bin/firefox' -o \
              -path '*/dist/bin/zen' \
              2>/dev/null || true

            echo
            echo "== Disk =="
            df -h

            echo
            echo "== Largest directories =="
            du -h -d 2 . 2>/dev/null | sort -hr | head -n 80 || true
          } | tee "$NEVAI_LINUX_LOG_DIR/build-output-candidates.txt"

          echo
          echo "== Collected log files =="
          find "$NEVAI_LINUX_LOG_DIR" -maxdepth 10 -type f -print | sort || true

      - name: Upload Linux discovery logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nevai-linux-discovery-logs
          path: /tmp/nevai-linux-discovery-logs
          if-no-files-found: warn
          retention-days: 7

      - name: Inspect build outputs
        if: ${{ always() }}
        run: |
          set -euxo pipefail

          echo "== Top-level =="
          ls -la

          echo
          echo "== Engine obj dirs =="
          find engine -maxdepth 2 -type d -name 'obj-*' -print || true

          echo
          echo "== Possible dist/bin =="
          find engine -path '*/dist/bin' -type d -print || true

          echo
          echo "== Possible application files =="
          find engine \
            -path '*/dist/bin/application.ini' -o \
            -path '*/dist/bin/nevai' -o \
            -path '*/dist/bin/firefox' -o \
            -path '*/dist/bin/zen' \
            2>/dev/null || true

          echo
          echo "== Disk after build =="
          df -h