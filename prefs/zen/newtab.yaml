# New Tab layout: "minimal" keeps Zen's URL-bar new-tab (default).
# "search-hub" opens Astra's Search Hub chrome page instead.
- name: astra.newtab.layout
  value: "minimal"

# JSON array of Search Hub shortcut objects {id, name, url, iconKey?}.
# Empty string = built-in catalog defaults. Never fetched from the network.
- name: astra.newtab.search-hub.shortcuts
  value: ""
