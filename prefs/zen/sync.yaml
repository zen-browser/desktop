  value: true

- name: services.sync.prefs.sync.zen.theme.essentials-favicon-bg
  value: true

- name: services.sync.prefs.sync.zen.theme.disable-lightweight
  value: true

- name: services.sync.prefs.sync.zen.theme.use-system-colors
  value: true

- name: services.sync.prefs.sync.zen.theme.hide-tab-throbber
  value: true

