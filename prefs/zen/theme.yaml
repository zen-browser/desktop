- name: zen.theme.accent-color
  value: "AccentColor"

- name: zen.theme.content-element-separation
  value: 8

- name: zen.theme.dark-mode-bias
  value: 0.3

- name: zen.theme.gradient.show-custom-colors
  value: false

- name: zen.theme.india-packs.stage
  value: "all"

- name: zen.theme.picker.preview
  value: true

- name: zen.theme.picker.favorites
  value: "[]"

- name: zen.theme.picker.recents
  value: "[]"

- name: zen.theme.picker.max-recents
  value: 8

- name: zen.theme.essentials-favicon-bg
  value: true

- name: zen.theme.acrylic-elements
  value: true

# Astra built-in Transparent Mode (chrome glass). Independent of
# browser.tabs.allow_transparent_browser (web-content transparency).
# Desired-state only — effective mode is computed per window at runtime.
# Fresh profiles: enabled (restores pre-V2 always-on glass product appearance
# under Astra ownership). Explicit user on/off values are preserved.
- name: astra.theme.transparent.enabled
  value: true

# Requested glass path: auto | acrylic | mica | mica-alt | astra-glass
# Effective mode is never stored in prefs.
- name: astra.theme.transparent.mode
  value: "auto"

# One-shot migration from the legacy astra-transparent Zen Mod.
- name: astra.theme.transparent.mod-migrated
  value: false

# One-shot: Astra owns widget.windows.mica* (clears stale always-on user values
# when Transparent Mode is off). Does not alter astra.theme.transparent.enabled.
- name: astra.theme.transparent.v2-native-owned
  value: false

# Web-content transparency (Firefox default). Keep false so pages with missing
# backgrounds do not show the browser theme through. Not controlled by
# astra.theme.transparent.enabled.
- name: browser.tabs.allow_transparent_browser
  value: false

- name: zen.theme.disable-lightweight
  value: true

- name: zen.theme.use-system-colors
  value: false

- name: zen.theme.hide-tab-throbber
  value: true

- name: zen.theme.styled-status-panel
  value: true
  condition: "defined(XP_MACOSX)"

- name: zen.theme.hide-unified-extensions-button
  value: true

# ==== Mark: border radius ====

# -1 will use platform-native values
# Set to a positive value to override with a custom radius
- name: zen.theme.border-radius
  value: -1

- name: zen.performance.low-bandwidth-mode.enabled
  value: true

- name: zen.performance.low-bandwidth-mode.block-images
  value: false

- name: zen.performance.low-bandwidth-mode.block-autoplay
  value: true

- name: zen.performance.low-bandwidth-mode.block-fonts
  value: true

- name: zen.performance.low-bandwidth-mode.lazy-loading
  value: true

- name: zen.view.hide-window-controls
  value: true
  condition: "defined(XP_WIN)"
