# Astra: Aggressive low-RAM response (macOS + Windows)
- name: browser.lowMemoryResponseMask
  value: 3
  condition: "defined(XP_MACOSX) || defined(XP_WIN)"

- name: network.predictor.enable-hover-on-ssl
  value: false

# See https://github.com/zen-browser/desktop/issues/11599, this pref seems to
# have disabled itself on macos for some unknown reason.
# Make sure its in sync with:
# https://searchfox.org/firefox-main/rev/1477feb9706f4ccc5bd571c1c215832a6fbb7464/modules/libpref/init/StaticPrefList.yaml#7741-7748
- name: gfx.webrender.compositor
  condition: "defined(XP_WIN) || defined(XP_DARWIN)"
  value: "@cond"
  mirror: once

# Astra: Hardware acceleration — match upstream enabled defaults (no force-disable)
- name: gfx.canvas.accelerated
  value: true
- name: layers.gpu-process.enabled
  value: true
- name: media.hardware-video-decoding.enabled
  value: true

# JavaScript JIT — keep Ion/Baseline on; asm.js stays at upstream default (false).
# Forcing asmjs=true contradicted Firefox 149 (asm.js disabled) and is not a
# WebGL/3D win.
- name: javascript.options.ion
  value: true
- name: javascript.options.baselinejit
  value: true

# Memory cache: restore Firefox dynamic sizing (-1). A hard 48 MB cap starved
# image-heavy and 3D asset pages after disk-cache cold starts.
- name: browser.cache.memory.enable
  value: true
- name: browser.cache.memory.capacity
  value: -1
- name: browser.cache.disk.enable
  value: true
- name: browser.cache.disk.smart_size.enabled
  value: true

# BFCache / session history — restore Firefox default (-1 = automatic).
# Cap of 1 forced almost every back/forward navigation to full reload.
- name: browser.sessionhistory.max_total_viewers
  value: -1
- name: browser.sessionhistory.max_entries
  value: 50
- name: image.mem.max_decoded_image_kb
  value: 98304
- name: media.memory_cache_max_size
  value: 32768
- name: browser.sessionstore.max_tabs_undo
  value: 6

# Content notification interval — Firefox upstream is 120000 µs.
- name: content.notify.interval
  value: 120000
- name: image.mem.decode_bytes_at_a_time
  value: 65536

# Astra: Session save less frequently (faster UI)
- name: browser.sessionstore.interval
  value: 15000

# Astra: DNS over HTTPS - faster + secure connectivity
- name: network.trr.mode
  value: 2
- name: network.trr.uri
  value: "https://mozilla.cloudflare-dns.com/dns-query"
- name: network.trr.bootstrapAddr
  value: "1.1.1.1"

# Connection timeouts — restore Firefox retry default (250 ms). Zero disabled
# normal retry pacing and could thrash failing routes.
- name: network.http.connection-retry-timeout
  value: 250
- name: network.http.connection-timeout
  value: 90
- name: network.http.response.timeout
  value: 300
- name: network.http.fast-fallback-to-IPv4
  value: true
- name: network.http.max-persistent-connections-per-server
  value: 6

# Astra: Smooth scroll without extra compositor precision (saves CPU/RAM)
- name: general.smoothScroll
  value: true
- name: general.smoothScroll.pages
  value: false
- name: layout.frame_rate.precise
  value: false

# dom.ipc.processCount is intentionally NOT overridden.
# Upstream all.js sets 8 normally, 4 under ASAN/TSAN, 1 under fuzzing.
# Astra previously forced processCount.web=4 (wrong pref / too low). Removing
# the override restores exact platform-adaptive Firefox behavior.
