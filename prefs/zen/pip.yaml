# Arc-like PiP corner snap + trackpad swipe (macOS). No-ops on other platforms.
- name: zen.pip.corner-snap.enabled
  value: true

- name: zen.pip.corner-snap.swipe.enabled
  value: true

- name: zen.pip.corner-snap.animation-ms
  value: 180
