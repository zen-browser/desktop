- name: browser.startup.page
  value: 3

- name: browser.startup.homepage
  value: "about:home"

- name: browser.sessionstore.restore_pinned_tabs_on_demand
  value: true

# Astra: Tab hover previews use extra RAM
- name: browser.tabs.hoverPreview.enabled
  value: false

- name: browser.tabs.hoverPreview.showThumbnails
  value: false

- name: browser.tabs.unloadTabInContextMenu
  value: true

- name: browser.tabs.unloadOnLowMemory
  value: true

- name: browser.tabs.fadeOutExplicitlyUnloadedTabs
  value: true

- name: browser.toolbars.bookmarks.visibility
  value: "newtab"

- name: widget.non-native-theme.scrollbar.style
  value: 2

- name: widget.non-native-theme.use-theme-accent
  value: true

- name: browser.download.autohideButton
  value: false

- name: sidebar.revamp
  value: true
  locked: false

# Firefox 153 Open Tabs sidebar panel. firefox.js defaults this false
# (Nimbus-gated upstream). New Astra profiles already get "opentabs" in
# sidebar.main.tools; without this gate the launcher button stays hidden.
- name: sidebar.openTabsPanel.enabled
  value: true

# Firefox 153 enables AI chatbot in the sidebar launcher by default.
# Keep the customize option available (do not hide the tool), but do not
# check it out of the box — Astra deprioritizes AI-forward chrome.
- name: sidebar.main.tools
  value: "history,bookmarks,opentabs"

- name: sidebar.verticalTabs
  value: false
  locked: true

- name: browser.preferences.experimental
  value: true

- name: browser.download.manager.addToRecentDocs
  value: false

- name: browser.download.alwaysOpenPanel
  value: false

- name: app.update.checkInstallTime.days
  value: 6
  condition: "defined(MOZILLA_OFFICIAL)"

- name: browser.profiles.enabled
  value: false

- name: browser.tabs.groups.enabled
  value: true

- name: browser.urlbar.scotchBonnet.enableOverride
  value: false

- name: browser.tabs.groups.hoverPreview.enabled
  locked: true
  value: true

- name: browser.ml.linkPreview.enabled
  value: false

- name: browser.tabs.closeWindowWithLastTab
  value: false

- name: browser.tabs.dragDrop.multiselectStacking
  value: true

- name: browser.tabs.notes.enabled
  value: false

- name: browser.tabs.dragDrop.dragToPin.enabled
  value: true

- name: browser.tabs.dragDrop.moveOverThresholdPercent
  value: 50 # Percentage of tab height to trigger move over on drag-and-drop

- name: browser.settings-redesign.enabled
  value: true

- name: browser.tabs.splitView.enabled
  value: false
  locked: true

# See gh-13853 for details on why we should disable this preference
- name: browser.privatebrowsing.resetPBM.enabled
  value: false

# See gh-12985 for details on the following preferences
- name: browser.search.widget.new
  value: true

# Astra: user-visible privacy and anti-scam defaults
- name: browser.contentblocking.category
  value: "strict"

- name: privacy.trackingprotection.enabled
  value: true

- name: privacy.trackingprotection.socialtracking.enabled
  value: true

- name: browser.safebrowsing.phishing.enabled
  value: true

- name: browser.safebrowsing.malware.enabled
  value: true

- name: browser.safebrowsing.downloads.enabled
  value: true

- name: browser.safebrowsing.downloads.remote.enabled
  value: true

- name: dom.security.https_only_mode
  value: true

- name: browser.newtabpage.activity-stream.logowordmark.alwaysVisible
  value: false

# Astra: Cryptomining protection
- name: privacy.trackingprotection.cryptomining.enabled
  value: true
- name: privacy.trackingprotection.fingerprinting.enabled
  value: true

# Astra: Block dangerous downloads
- name: browser.safebrowsing.downloads.remote.block_dangerous
  value: true
- name: browser.safebrowsing.downloads.remote.block_dangerous_host
  value: true
- name: browser.safebrowsing.downloads.remote.block_potentially_unwanted
  value: true
- name: browser.safebrowsing.downloads.remote.block_uncommon
  value: true

# Astra: Block popup notifications spam
- name: permissions.default.desktop-notification
  value: 2
- name: dom.webnotifications.enabled
  value: true

# Astra: Block unwanted popups
- name: dom.disable_open_during_load
  value: true

# Astra: Strip tracking params when copying/sharing links (no page-load cost)
- name: privacy.query_stripping.enabled
  value: true
- name: privacy.query_stripping.strip_on_share.enabled
  value: true

# Astra: Block autoplay with sound by default (fewer drive-by annoyances)
- name: media.autoplay.default
  value: 5
- name: media.autoplay.block-webaudio
  value: false

# Astra: Block downloads over HTTP; email tracker blocking (strict ETP)
- name: dom.block_download_insecure
  value: true
- name: privacy.trackingprotection.emailtracking.enabled
  value: true

# Astra: AI/ML phishing protection
- name: browser.safebrowsing.provider.google4.updateURL
  value: "https://safebrowsing.googleapis.com/v4/threatListUpdates:fetch?$ct=application/x-protobuf&key=%GOOGLE_SAFEBROWSING_API_KEY%&pver=2.2"
- name: browser.safebrowsing.provider.google4.gethashURL
  value: "https://safebrowsing.googleapis.com/v4/fullHashes:find?$ct=application/x-protobuf&key=%GOOGLE_SAFEBROWSING_API_KEY%&pver=2.2"

# Disabled from https://searchfox.org/firefox-main/rev/d6bfff43852356ca98af848b4705d37f8d41856f/modules/libpref/init/StaticPrefList.yaml#2008
# Only enabled for windows, doesn't really fit inside Zen.
- name: browser.startup.preXulSkeletonUI
  value: false
