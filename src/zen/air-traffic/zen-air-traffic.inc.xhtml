<!DOCTYPE window>

<window
  xmlns:html="http://www.w3.org/1999/xhtml"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  data-l10n-id="air-traffic-window"
  windowtype="Zen:ControlFlow"
  id="zenAirTrafficDialog"
  class="dialogBox"
>
  <linkset>
    <html:link rel="stylesheet" href="chrome://global/skin/global.css" type="text/css" />
    <html:link rel="stylesheet" href="chrome://browser/content/zen-styles/zen-theme.css" type="text/css" />
    <html:link rel="stylesheet" href="chrome://browser/content/zen-styles/zen-air-traffic.css" type="text/css" />
    <html:link rel="stylesheet" href="chrome://browser/skin/zen-icons/icons.css" type="text/css" />
    <html:link rel="stylesheet" href="chrome://browser/content/zen-styles/zen-animations.css" type="text/css" />
    <html:link rel="stylesheet" type="text/css" href="chrome://browser/content/zen-styles/zen-popup.css" />
    <html:link rel="localization" href="browser/zen-air-traffic.ftl" />
  </linkset>

  <!-- Loading in the window module -->
  <script>
    const { nsZenAirTrafficDialog } = ChromeUtils.importESModule(
      "resource:///modules/zen/airtraffic/ZenAirTrafficDialog.mjs",
    );
    window.addEventListener("load", () => {
      const args = window.arguments?.[0] || {};
      window.airtrafficDialog = new nsZenAirTrafficDialog(
        document,
        window,
        args.parentWindow,
      );
    });
  </script>

  <vbox id="zen-air-traffic-dialog-container">
    <vbox id="at-container">
      <hbox id="at-header">
        <h3 data-l10n-id="zen-air-traffic-dialog-title"></h3>
        <html:div id="at-left">
          <button id="at-new-route" data-l10n-id="zen-air-traffic-new-route"></button>
          <button class="close-icon" id="at-close"></button>
        </html:div>
      </hbox>
      <html:hr class="hr"></html:hr>
      <vbox id="at-content">
        <vbox id="at-empty-content">
          <image class="at-airplane"></image>
          <p data-l10n-id="zen-air-traffic-rulepanel-placeholder"></p>
        </vbox>
        <!-- All rules will be injected here later -->
      </vbox>
      <html:hr class="hr"></html:hr>
      <hbox id="at-footer">
        <h4 data-l10n-id="zen-air-traffic-external-default"></h4>
        <html:div id="at-left">
          <menulist class="select" id="at-default-external-open-in">
            <menupopup id="at-default-external-open-in-popup">
              <!-- Select open in types will be injected here -->
            </menupopup>
          </menulist>
        </html:div>
      </hbox>
    </vbox>
  </vbox>
</window>
