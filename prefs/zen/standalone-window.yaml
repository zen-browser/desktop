- name: zen.standalone-window.enabled
  value: false

# Size of a newly opened standalone window. Not surfaced in the settings UI;
# these exist so the default can be tuned without a rebuild.
- name: zen.standalone-window.default-width
  value: 1280

- name: zen.standalone-window.default-height
  value: 820

# When Zen was brought to the front only to show a standalone window, closing
# that window sends the user back to the application the link came from.
- name: zen.standalone-window.return-focus-on-close
  value: true
