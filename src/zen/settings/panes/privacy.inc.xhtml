        <html:section id="zen-settings-pane-privacy" class="zen-settings-pane" role="tabpanel" data-pane="privacy" hidden="hidden">
          <html:div class="zen-settings-group">
            <html:h2 data-l10n-id="zen-settings-window-protection-header"/>
            <html:div class="zen-settings-card">
              <html:div class="zen-settings-row">
                <html:span id="zen-settings-tracking-label" class="zen-settings-row-text" data-l10n-id="zen-settings-window-tracking-protection"/>
                <menulist id="zen-settings-tracking-protection" data-pref="browser.contentblocking.category" aria-labelledby="zen-settings-tracking-label">
                  <menupopup>
                    <menuitem value="standard" data-l10n-id="zen-settings-window-tracking-protection-standard"/>
                    <menuitem value="strict" data-l10n-id="zen-settings-window-tracking-protection-strict"/>
                    <menuitem value="custom" data-l10n-id="zen-settings-window-tracking-protection-custom" disabled="true"/>
                  </menupopup>
                </menulist>
              </html:div>
              <html:div class="zen-settings-row zen-settings-toggle-row">
                <html:span class="zen-settings-row-text" data-l10n-id="zen-settings-window-global-privacy-control"/>
                <html:moz-toggle class="zen-settings-toggle" data-pref="privacy.globalprivacycontrol.enabled"/>
              </html:div>
              <html:div class="zen-settings-row zen-settings-toggle-row">
                <html:span class="zen-settings-row-text" data-l10n-id="zen-settings-window-https-only"/>
                <html:moz-toggle class="zen-settings-toggle" data-pref="dom.security.https_only_mode"/>
              </html:div>
            </html:div>
          </html:div>

          <html:div class="zen-settings-group">
            <html:h2 data-l10n-id="zen-settings-window-data-header"/>
            <html:div class="zen-settings-card">
              <html:div class="zen-settings-row zen-settings-toggle-row">
                <html:span class="zen-settings-row-text" data-l10n-id="zen-settings-window-save-passwords"/>
                <html:moz-toggle class="zen-settings-toggle" data-pref="signon.rememberSignons"/>
              </html:div>
              <html:div class="zen-settings-row">
                <html:span class="zen-settings-row-text" data-l10n-id="zen-settings-window-clear-data"/>
                <html:button class="zen-settings-button" data-action="clear-data" data-l10n-id="zen-settings-window-clear-data-button"/>
              </html:div>
            </html:div>
          </html:div>

          <html:div class="zen-settings-actions">
            <html:button class="zen-settings-button" data-action="open-privacy-settings" data-l10n-id="zen-settings-window-more-privacy"/>
          </html:div>
        </html:section>
