<html:template id="template-paneZenToolbarUrlbar">

<hbox id="zenCompactToolbarCategory"
      class="subcategory"
      hidden="true"
      data-category="paneZenToolbarUrlbar">
<html:h1 data-l10n-id="zen-compact-toolbar-section-title"/>
</hbox>

<groupbox id="zenCompactToolbarGroup" data-category="paneZenToolbarUrlbar" hidden="true" class="highlighting-group">
      <label><html:h2 data-l10n-id="zen-look-and-feel-compact-view-header"/></label>
      <description class="description-deemphasized" data-l10n-id="zen-look-and-feel-compact-view-description" />

      <vbox class="indent">
            <checkbox id="zenLooksAndFeelEnableToolbarFlashPopup"
                      data-l10n-id="zen-look-and-feel-compact-toolbar-flash-popup"
                      preference="zen.view.compact.toolbar-flash-popup"/>
      </vbox>

      <label><html:h2 data-l10n-id="zen-look-and-feel-window-drag-header"/></label>
      <description class="description-deemphasized" data-l10n-id="zen-look-and-feel-window-drag-description" />

      <vbox class="indent">
            <checkbox id="zenLooksAndFeelWindowDragEnabled"
                  data-l10n-id="zen-window-drag-enabled"
                  preference="zen.view.drag-window-from-content"/>
      </vbox>
</groupbox>

<hbox id="zenUrlBarCategory"
      class="subcategory"
      hidden="true"
      data-category="paneZenToolbarUrlbar">
<html:h1 data-l10n-id="zen-address-bar-section-title"/>
</hbox>

<groupbox id="zenUrlbarGroup" data-category="paneZenToolbarUrlbar" hidden="true" class="highlighting-group">
      <label><html:h2 data-l10n-id="zen-urlbar-header"/></label>
      <description class="description-deemphasized" data-l10n-id="zen-urlbar-description" />

      <checkbox id="zenThemeGlassEnabled"
                data-l10n-id="zen-theme-glass-enabled"
                preference="zen.theme.glass"/>

      <hbox align="center">
            <label data-l10n-id="zen-urlbar-behavior-label"/>
            <menulist preference="zen.urlbar.behavior">
                  <menupopup>
                        <menuitem data-l10n-id="zen-urlbar-behavior-normal" value="normal"/>
                        <menuitem data-l10n-id="zen-urlbar-behavior-floating-on-type" value="floating-on-type"/>
                        <menuitem data-l10n-id="zen-urlbar-behavior-float" value="float"/>
                  </menupopup>
            </menulist>
        </hbox>
</groupbox>

</html:template>
